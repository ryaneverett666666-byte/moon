<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <title>Луна 2087: Рассвет</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    html, body { width: 100%; height: 100%; overflow: hidden !important; overscroll-behavior: none !important; }
    body { background: #01020a; font-family: 'Segoe UI', Arial, sans-serif; touch-action: none; color: #c8e6ff; position: fixed; inset: 0; -webkit-user-select: none; user-select: none; }
    canvas { display: block; width: 100%; height: 100%; position: absolute; top: 0; left: 0; z-index: 1; }

    #loading { position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; background: #01020a; z-index: 100; transition: opacity 0.6s; }
    .spinner { width: 50px; height: 50px; border: 2px solid rgba(0,229,255,0.12); border-top-color: #00e5ff; border-right-color: rgba(0,229,255,0.2); border-radius: 50%; animation: spin 1s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }
    #loading-text { color: #00e5ff; font-size: 13px; letter-spacing: 5px; margin-top: 22px; text-transform: uppercase; text-shadow: 0 0 12px rgba(0,229,255,0.5); }
    #loading-progress { width: 180px; height: 2px; margin-top: 16px; background: rgba(0,229,255,0.1); border-radius: 1px; overflow: hidden; }
    #loading-bar { height: 100%; width: 0%; border-radius: 1px; background: linear-gradient(90deg, #00e5ff, #0088ff); box-shadow: 0 0 8px rgba(0,229,255,0.5); transition: width 0.3s ease; }
    #nowebgl { position: fixed; inset: 0; display: none; flex-direction: column; align-items: center; justify-content: center; background: #01020a; color: #ff5555; font-size: 15px; text-align: center; z-index: 200; padding: 30px; }

    #topbar { position: fixed; top: 0; left: 0; right: 0; z-index: 25; display: flex; justify-content: space-between; align-items: flex-start; padding: 0 14px; padding-top: max(6px, env(safe-area-inset-top)); pointer-events: none; flex-wrap: wrap; gap: 4px; }
    #logo { pointer-events: auto; display: flex; align-items: center; gap: 8px; flex-shrink: 0; }
    #logo-icon { width: 26px; height: 26px; border: 2px solid #00e5ff; border-radius: 50%; position: relative; box-shadow: 0 0 10px rgba(0,229,255,0.4); flex-shrink: 0; }
    #logo-icon::after { content: ''; position: absolute; inset: 3px; border-radius: 50%; background: radial-gradient(circle at 35% 35%, rgba(0,229,255,0.2), #003344); }
    #logo-text { font-size: 11px; letter-spacing: 2px; text-transform: uppercase; color: #00e5ff; font-weight: 600; white-space: nowrap; }

    #res-bar { pointer-events: auto; display: flex; gap: 0; background: rgba(5,12,25,0.85); border: 1px solid rgba(0,229,255,0.15); border-radius: 6px; overflow: hidden; backdrop-filter: blur(8px); flex-wrap: nowrap; overflow-x: auto; scrollbar-width: none; max-width: 100%; }
    #res-bar::-webkit-scrollbar { display: none; }
    .res-cell { padding: 5px 8px; display: flex; flex-direction: column; align-items: center; gap: 1px; border-right: 1px solid rgba(0,229,255,0.08); min-width: 50px; flex: 0 0 auto; }
    .res-cell:last-child { border-right: none; }
    .res-label { font-size: 7px; color: #aaccff; letter-spacing: 1px; text-transform: uppercase; opacity: 0.9; white-space: nowrap; }
    .res-value { font-size: 12px; color: #00e5ff; font-weight: 700; white-space: nowrap; }
    .res-cell.regolith .res-value { color: #ffaa44; }
    .res-cell.helium .res-value { color: #7fff7f; }
    .res-cell.energy .res-value { color: #44aaff; }
    .res-cell.pop .res-value { color: #ff66aa; }
    .res-cell.pp .res-value { color: #ff44ff; }
    .res-cell.logistics .res-value { color: #ff8844; }
    .res-cell.low .res-value { color: #ff4444 !important; animation: pulse-red 1s infinite; }
    @keyframes pulse-red { 0%,100% { opacity: 1; } 50% { opacity: 0.5; } }

    #debuff-bar { position: fixed; top: 52px; left: 50%; transform: translateX(-50%); z-index: 24; display: none; background: rgba(255,60,60,0.2); border: 1px solid rgba(255,80,80,0.4); border-radius: 6px; padding: 4px 12px; font-size: 10px; color: #ff8888; backdrop-filter: blur(8px); white-space: nowrap; }
    #debuff-bar.show { display: block; }

    #ai-panel { position: fixed; left: 8px; top: 90px; z-index: 23; background: rgba(255,60,60,0.1); border: 1px solid rgba(255,80,80,0.2); border-radius: 6px; padding: 6px 8px; backdrop-filter: blur(8px); max-width: 160px; pointer-events: none; }
    #ai-panel-title { font-size: 8px; color: #ff6666; letter-spacing: 1px; text-transform: uppercase; margin-bottom: 3px; font-weight: 600; }
    #ai-panel-info { font-size: 9px; color: #aa8888; line-height: 1.3; }

    #save-indicator { position: fixed; top: 52px; right: 10px; z-index: 24; font-size: 9px; color: #456; padding: 2px 6px; background: rgba(5,12,25,0.7); border-radius: 3px; display: none; }
    #save-indicator.show { display: block; }

    #log { position: fixed; right: 10px; top: 110px; z-index: 23; display: flex; flex-direction: column; gap: 2px; pointer-events: none; max-width: 200px; }
    .log-msg { font-size: 9px; color: #889; background: rgba(5,12,25,0.7); padding: 3px 6px; border-radius: 3px; border-left: 2px solid #00e5ff; animation: logfade 8s forwards; }
    .log-msg.warn { border-left-color: #ffaa44; color: #aa8; }
    .log-msg.bad { border-left-color: #ff4444; color: #aa6666; }
    .log-msg.good { border-left-color: #7fff7f; color: #88aa88; }
    @keyframes logfade { 0% { opacity: 0; transform: translateX(20px); } 5% { opacity: 1; transform: translateX(0); } 85% { opacity: 1; } 100% { opacity: 0; } }

    #zoom-controls { position: fixed; right: 8px; bottom: 54px; z-index: 25; display: flex; flex-direction: column; gap: 3px; }
    .zoom-btn { width: 34px; height: 34px; border: 1px solid rgba(0,229,255,0.2); background: rgba(5,12,25,0.7); color: #00e5ff; border-radius: 5px; cursor: pointer; font-size: 15px; backdrop-filter: blur(6px); transition: all 0.15s; font-family: inherit; display: flex; align-items: center; justify-content: center; }
    .zoom-btn:active { transform: scale(0.9); }

    #earth-panel { position: fixed; left: 8px; bottom: 54px; z-index: 25; max-width: 160px; pointer-events: none; }
    #earth-panel-title { font-size: 8px; color: #ff5522; letter-spacing: 1px; text-transform: uppercase; margin-bottom: 3px; font-weight: 600; }
    #earth-panel-bar { width: 100%; height: 2px; background: rgba(255,80,30,0.15); border-radius: 1px; overflow: hidden; margin-bottom: 4px; }
    #earth-panel-fill { height: 100%; width: 92%; border-radius: 1px; background: linear-gradient(90deg, #ff8844, #ff3322); }
    #earth-panel-text { font-size: 8px; color: #766; line-height: 1.3; }

    #tabs { position: fixed; left: 0; right: 0; bottom: 0; z-index: 26; display: flex; justify-content: center; gap: 0; padding: 0; padding-bottom: max(0px, env(safe-area-inset-bottom)); background: rgba(5,12,25,0.92); border-top: 1px solid rgba(0,229,255,0.15); backdrop-filter: blur(8px); }
    .tab-btn { flex: 1; padding: 8px 4px; background: transparent; border: none; color: #5a7a9a; font-size: 9px; cursor: pointer; font-family: inherit; display: flex; flex-direction: column; align-items: center; gap: 2px; transition: all 0.2s; border-top: 2px solid transparent; max-width: 80px; }
    .tab-btn .tab-icon { font-size: 18px; line-height: 1; }
    .tab-btn:active { transform: scale(0.92); }
    .tab-btn.active { color: #fff; border-top-color: #00e5ff; background: rgba(0,229,255,0.06); }

    #panel { position: fixed; left: 0; right: 0; bottom: 42px; z-index: 25; max-height: 55vh; overflow-y: auto; background: rgba(5,12,25,0.95); border-top: 1px solid rgba(0,229,255,0.12); backdrop-filter: blur(10px); padding: 10px; display: none; }
    #panel.show { display: block; }
    .panel-title { font-size: 13px; color: #00e5ff; font-weight: 600; margin-bottom: 8px; letter-spacing: 1px; text-transform: uppercase; }
    .build-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 8px; }
    .build-card { background: rgba(0,229,255,0.05); border: 1px solid rgba(0,229,255,0.15); border-radius: 6px; padding: 10px; cursor: pointer; transition: all 0.2s; position: relative; overflow: hidden; }
    .build-card:active { transform: scale(0.96); }
    .build-card.affordable { border-color: rgba(0,229,255,0.35); }
    .build-card.affordable:hover { background: rgba(0,229,255,0.1); }
    .build-card.unaffordable { opacity: 0.45; cursor: not-allowed; }
    .build-card.building { border-color: #ffaa44; cursor: wait; }
    .build-name { font-size: 12px; color: #fff; font-weight: 600; margin-bottom: 3px; }
    .build-desc { font-size: 9px; color: #789; line-height: 1.3; margin-bottom: 6px; }
    .build-cost { display: flex; flex-wrap: wrap; gap: 4px; font-size: 9px; }
    .build-cost span { white-space: nowrap; }
    .cost-r { color: #ffaa44; } .cost-h { color: #7fff7f; } .cost-e { color: #44aaff; } .cost-p { color: #ff66aa; } .cost-l { color: #ff8844; }
    .build-timer { position: absolute; bottom: 0; left: 0; right: 0; height: 3px; background: rgba(255,170,68,0.2); overflow: hidden; }
    .build-timer-fill { height: 100%; background: linear-gradient(90deg, #ffaa44, #ff8844); transition: width 0.3s; }

    .unit-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 8px; }
    .unit-card { background: rgba(255,100,100,0.05); border: 1px solid rgba(255,100,100,0.15); border-radius: 6px; padding: 10px; cursor: pointer; transition: all 0.2s; }
    .unit-card:active { transform: scale(0.96); }
    .unit-card.affordable { border-color: rgba(255,100,100,0.35); }
    .unit-card.unaffordable { opacity: 0.45; cursor: not-allowed; }
    .unit-name { font-size: 12px; color: #fff; font-weight: 600; margin-bottom: 3px; }
    .unit-desc { font-size: 9px; color: #789; line-height: 1.3; margin-bottom: 6px; }
    .unit-stats { display: flex; gap: 8px; font-size: 9px; color: #a88; }
    .unit-stat { display: flex; flex-direction: column; align-items: center; }
    .unit-stat .val { color: #ff8844; font-size: 11px; font-weight: 600; }

    .pol-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); gap: 8px; }
    .pol-card { background: rgba(0,229,255,0.05); border: 1px solid rgba(0,229,255,0.15); border-radius: 6px; padding: 12px; cursor: pointer; transition: all 0.2s; position: relative; }
    .pol-card:active { transform: scale(0.96); }
    .pol-card.current { border-color: #00e5ff; background: rgba(0,229,255,0.12); cursor: default; }
    .pol-card.current::after { content: 'АКТИВЕН'; position: absolute; top: 4px; right: 6px; font-size: 7px; color: #00e5ff; font-weight: 700; letter-spacing: 1px; }
    .pol-card.unaffordable { opacity: 0.5; }
    .pol-name { font-size: 13px; color: #fff; font-weight: 600; margin-bottom: 4px; }
    .pol-pros { font-size: 9px; color: #7fff7f; line-height: 1.3; margin-bottom: 3px; }
    .pol-cons { font-size: 9px; color: #ff6644; line-height: 1.3; margin-bottom: 6px; }
    .pol-card .pp-cost { font-size: 10px; color: #ff44ff; font-weight: 600; }

    @media (max-width: 768px) {
      #logo-text { font-size: 9px; letter-spacing: 1px; }
      #logo-icon { width: 22px; height: 22px; }
      .res-cell { padding: 4px 5px; min-width: 42px; }
      .res-label { font-size: 6px; letter-spacing: 0.5px; }
      .res-value { font-size: 10px; }
      .tab-btn { font-size: 7px; padding: 6px 2px; max-width: 60px; }
      .tab-btn .tab-icon { font-size: 16px; }
      #panel { bottom: 38px; max-height: 50vh; padding: 8px; }
      .build-grid, .unit-grid { grid-template-columns: repeat(auto-fill, minmax(120px, 1fr)); }
      .pol-grid { grid-template-columns: 1fr; }
      .zoom-btn { width: 30px; height: 30px; font-size: 13px; }
      #ai-panel { max-width: 130px; }
      #log { max-width: 160px; top: 90px; }
    }
  </style>
</head>
<body>
  <div id="loading">
    <div class="spinner"></div>
    <div id="loading-text">Луна 2087: Рассвет</div>
    <div id="loading-progress"><div id="loading-bar"></div></div>
  </div>
  <div id="nowebgl">
    <h2>WebGL не поддерживается</h2>
    <p style="margin-top:10px;color:#8ac;">Попробуйте другой браузер</p>
  </div>

  <div id="topbar">
    <div id="logo"><div id="logo-icon"></div><div id="logo-text">Луна 2087: Рассвет</div></div>
    <div id="res-bar">
      <div class="res-cell regolith"><span class="res-label">Реголит</span><span class="res-value" id="r-regolith">0</span></div>
      <div class="res-cell helium"><span class="res-label">Гелий-3</span><span class="res-value" id="r-helium">0</span></div>
      <div class="res-cell energy"><span class="res-label">Энергия</span><span class="res-value" id="r-energy">0/0</span></div>
      <div class="res-cell pop"><span class="res-label">Население</span><span class="res-value" id="r-pop">0/0</span></div>
      <div class="res-cell pp"><span class="res-label">Полит.оч.</span><span class="res-value" id="r-pp">0</span></div>
      <div class="res-cell logistics"><span class="res-label">Логист.</span><span class="res-value" id="r-logistics">0/0</span></div>
    </div>
  </div>

  <div id="ai-panel"><div id="ai-panel-title">Колония «Арес»</div><div id="ai-panel-info">ИИ-противник</div></div>
  <div id="debuff-bar"></div>
  <div id="save-indicator">Сохранено</div>
  <div id="log"></div>

  <div id="zoom-controls">
    <button class="zoom-btn" id="btn-zoom-in">+</button>
    <button class="zoom-btn" id="btn-zoom-out">−</button>
    <button class="zoom-btn" id="btn-reset" style="font-size:12px;">↻</button>
  </div>

  <div id="earth-panel">
    <div id="earth-panel-title">Состояние Земли</div>
    <div id="earth-panel-bar"><div id="earth-panel-fill"></div></div>
    <div id="earth-panel-text">Атмосфера разрушена. Поверхность горит 16 лет. Связь потеряна в 2073.</div>
  </div>

  <div id="panel"><div id="panel-content"></div></div>

  <div id="tabs">
    <button class="tab-btn" data-tab="build"><span class="tab-icon">🏗</span>Стройка</button>
    <button class="tab-btn" data-tab="units"><span class="tab-icon">🪖</span>Войска</button>
    <button class="tab-btn" data-tab="politics"><span class="tab-icon">🏛</span>Политика</button>
    <button class="tab-btn" data-tab="map"><span class="tab-icon">🗺</span>Карта</button>
    <button class="tab-btn" data-tab="info"><span class="tab-icon">ℹ</span>Инфо</button>
  </div>

  <script type="importmap">
    { "imports": { "three": "https://unpkg.com/three@0.160.0/build/three.module.js", "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/" } }
  </script>

  <script type="module">
    import * as THREE from 'three';
    import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

    // === WEBGL CHECK ===
    const tc = document.createElement('canvas');
    if (!tc.getContext('webgl2') && !tc.getContext('webgl')) {
      document.getElementById('loading').style.display = 'none';
      document.getElementById('nowebgl').style.display = 'flex';
      throw new Error('No WebGL');
    }

    // === YANDEX SDK (динамическая загрузка, не блокирует страницу) ===
    let ysdk = null;
    const sdkScript = document.createElement('script');
    sdkScript.src = 'https://yandex.ru/games/sdk/v1';
    sdkScript.onload = () => { if (typeof YaGames !== 'undefined') YaGames.init().then(s => { ysdk = s; s.features.LoadingAPI?.ready(); }).catch(e => console.warn('SDK:', e)); };
    sdkScript.onerror = () => console.warn('Yandex SDK не загружен');
    document.head.appendChild(sdkScript);

    // =====================
    // === ИГРОВЫЕ ДАННЫЕ ===
    // =====================
    const REGIMES = {
      technocracy: { name: 'Технократия', ppCost: 0, pros: '+30% к исследованиям\nДредноуты: −20% Гелий-3\nШахты работают без людей', cons: 'Дорогое содержание куполов\nСлабая пехота', mods: { research: 1.3, heliumUse: 0.8, domeUpkeep: 1.5, infantryPower: 0.7, minePopNeed: 0 } },
      military:    { name: 'Военная Хунта', ppCost: 200, pros: 'Войска строятся +40% быстрее\nТурели бьют дальше', cons: '−25% к добыче ресурсов\nВысокий риск бунтов', mods: { buildSpeed: 1.4, resourceRate: 0.75, turretRange: 1.3, revoltRisk: 1.5 } },
      corporate:   { name: 'Корпоратократия', ppCost: 200, pros: 'Торговые сделки +50%\nРеголит добывается быстрее', cons: 'Наёмники требуют постоянной оплаты', mods: { tradeBonus: 1.5, regolithRate: 1.3, mercUpkeep: 1.5 } },
      collective:  { name: 'Социал-Коллективизм', ppCost: 200, pros: 'Содержание населения −50%\nВысокая стабильность', cons: 'Медленные технологии\nТяжёлая техника строится дольше', mods: { popUpkeep: 0.5, research: 0.7, heavyBuildSpeed: 0.7, revoltRisk: 0.3 } },
    };

    const BUILDINGS = {
      dome:    { name: 'Жилой Купол',   desc: 'Жильё для 100 человек. Генерирует Полит. очки.', cost: { regolith: 50, helium: 10, energy: 5 },   buildTime: 30000, popCap: 100, ppRate: 0.05, energyUse: 5, icon: '⌂' },
      mine:    { name: 'Шахта',         desc: 'Добыча реголита и гелия-3. Ставится на месторождения.', cost: { regolith: 30, helium: 5, energy: 3 },   buildTime: 20000, regolithRate: 0.5, heliumRate: 0.15, energyUse: 3, popNeed: 5, icon: '⛏' },
      beacon:  { name: 'Маяк Связи',    desc: 'Расширяет радиус контроля. Открывает туман войны.', cost: { regolith: 40, helium: 5, energy: 2 },  buildTime: 15000, controlRadius: 1, energyUse: 2, icon: '📡' },
      outpost: { name: 'Аванпост',      desc: 'Укреплённая точка. Удерживает дальние шахты.', cost: { regolith: 60, helium: 15, energy: 4 },  buildTime: 40000, energyUse: 4, defense: 10, icon: '🛡' },
      lab:     { name: 'Лаборатория',   desc: 'Искусственное выращивание населения. +10 населения/мин.', cost: { regolith: 45, helium: 20, energy: 6 }, buildTime: 35000, popRate: 0.17, energyUse: 6, popNeed: 10, icon: '🔬' },
      turret:  { name: 'Турель',        desc: 'Автоматическая защита базы. Бьёт по врагам.', cost: { regolith: 35, helium: 10, energy: 3 },   buildTime: 25000, energyUse: 3, defense: 15, icon: '🔫' },
    };

    const UNITS = {
      builder:     { name: 'Строитель',  desc: 'Возводит здания, ремонтирует технику. Беззащитен в бою.', cost: { regolith: 20, energy: 2 },         buildTime: 15000, popNeed: 1, attack: 1,  defense: 2,  speed: 1,   type: 'infantry', icon: '🔧' },
      assault:     { name: 'Штурмовик',  desc: 'Космопехота. Захват аванпостов и шлюзов.', cost: { regolith: 30, helium: 5, energy: 3 },     buildTime: 20000, popNeed: 1, attack: 8,  defense: 5,  speed: 1.5, type: 'infantry', icon: '🔫' },
      dreadnought: { name: 'Дредноут',   desc: 'Тяжёлый лунный танк на Гелии-3. Огромный радиус. Жрёт энергию.', cost: { regolith: 80, helium: 30, energy: 8 }, buildTime: 45000, popNeed: 3, attack: 25, defense: 20, speed: 0.5, type: 'heavy', energyUpkeep: 2, icon: '🚜' },
    };

    // =====================
    // === СОСТОЯНИЕ ИГРЫ ===
    // =====================
    const SAVE_KEY = 'luna2087_rassvet_save';
    function defaultState() {
      return {
        regolith: 100, helium: 30, energy: 200, energyMax: 200, pop: 50, popMax: 100,
        politicalPoints: 0, ppMax: 1000, logistics: 5, logisticsMax: 5,
        regime: 'technocracy', debuffEnd: 0, debuffType: null,
        buildings: [{ id: 'dome', x: 0, z: 0, built: true, progress: 1 }],
        units: [], buildQueue: [],
        ai: { regolith: 50, helium: 20, pop: 30, popMax: 60, buildings: 1, units: 0, aggression: 0.3, techLevel: 1 },
        gameTime: 0,
      };
    }
    let state = null;
    try {
      const saved = localStorage.getItem(SAVE_KEY);
      if (saved) { state = JSON.parse(saved); const d = defaultState(); for (let k in d) if (state[k] === undefined) state[k] = d[k]; }
      else state = defaultState();
    } catch (e) { state = defaultState(); }

    function getMod(key) {
      const mods = REGIMES[state.regime].mods || {};
      let m = mods[key] !== undefined ? mods[key] : 1;
      if (state.debuffEnd > Date.now() && (key === 'regolithRate' || key === 'heliumRate')) m *= 0.5;
      return m;
    }

    function saveGame() {
      try {
        localStorage.setItem(SAVE_KEY, JSON.stringify(state));
        const si = document.getElementById('save-indicator');
        si.classList.add('show'); setTimeout(() => si.classList.remove('show'), 1000);
      } catch (e) { console.warn('Save failed', e); }
    }
    function resetGame() { localStorage.removeItem(SAVE_KEY); state = defaultState(); addLog('Новая игра', 'good'); updateUI(); }

    function addLog(msg, type) {
      const logEl = document.getElementById('log');
      const div = document.createElement('div');
      div.className = 'log-msg' + (type ? ' ' + type : '');
      div.textContent = msg;
      logEl.appendChild(div);
      setTimeout(() => div.remove(), 8000);
      while (logEl.children.length > 5) logEl.removeChild(logEl.firstChild);
    }

    // =====================
    // === ИГРОВОЙ ТИК =====
    // =====================
    function gameTick(dt) {
      let regRate = 0, helRate = 0, energyProd = 0, energyCons = 0, ppRate = 0, popRate = 0;
      state.buildings.forEach(b => {
        if (!b.built) return;
        const def = BUILDINGS[b.id];
        if (def.regolithRate) regRate += def.regolithRate * getMod('regolithRate');
        if (def.heliumRate)   helRate += def.heliumRate * getMod('heliumRate');
        if (def.ppRate)       ppRate += def.ppRate;
        if (def.popRate)      popRate += def.popRate;
        if (def.energyUse)    energyCons += def.energyUse;
        if (b.id === 'dome')  energyProd += 2;
      });
      state.energy = Math.min(state.energyMax, state.energy + energyProd * dt * 0.1);
      energyCons += state.units.length * 0.5;
      state.energy = Math.max(0, state.energy - energyCons * dt * 0.01);
      state.regolith = Math.min(9999, state.regolith + regRate * dt);
      state.helium = Math.min(9999, state.helium + helRate * dt);
      state.politicalPoints = Math.min(state.ppMax, state.politicalPoints + ppRate * dt);
      state.pop = Math.min(state.popMax, state.pop + popRate * dt);
      state.logistics = Math.min(state.logisticsMax, state.logistics + dt * 0.01);

      state.buildQueue.forEach(q => {
        q.remaining -= dt * 1000;
        if (q.remaining <= 0) {
          q.built = true;
          state.buildings.push({ id: q.id, x: q.x, z: q.z, built: true, progress: 1 });
          addLog('Построено: ' + BUILDINGS[q.id].name, 'good');
        }
      });
      state.buildQueue = state.buildQueue.filter(q => q.remaining > 0);

      aiTick(dt);

      if (state.debuffEnd <= Date.now() && state.debuffType) {
        state.debuffType = null;
        addLog('Политическая нестабильность завершена', 'good');
      }

      state.gameTime += dt;
      if (state.gameTime % 30 < dt) saveGame();
    }

    function aiTick(dt) {
      const ai = state.ai;
      ai.regolith += 0.3 * dt; ai.helium += 0.1 * dt;
      ai.pop = Math.min(ai.popMax, ai.pop + 0.05 * dt);
      if (Math.random() < 0.001 * dt && ai.buildings < 10) {
        ai.buildings++; ai.regolith -= 40; ai.helium -= 10;
        const types = ['mine', 'lab', 'dome'];
        const t = types[Math.floor(Math.random() * types.length)];
        addLog('Колония «Арес» построила: ' + (BUILDINGS[t]?.name || 'новое здание'), 'warn');
      }
      if (Math.random() < 0.0008 * dt && ai.units < 20) {
        ai.units++; ai.regolith -= 25;
        if (Math.random() < 0.3) addLog('Колония «Арес» готовит войска', 'warn');
      }
      if (ai.units >= 5 && Math.random() < ai.aggression * 0.0003 * dt) {
        const atkForce = Math.min(ai.units, Math.floor(ai.units * 0.6));
        ai.units -= atkForce;
        const myDef = state.units.reduce((s, u) => s + u.defense, 0) + state.buildings.reduce((s, b) => s + (BUILDINGS[b.id]?.defense || 0), 0);
        if (atkForce * 10 > myDef) {
          addLog('⚠ Атака «Арес»! Потери: ' + Math.floor(atkForce * 0.3) + ' юнитов', 'bad');
          if (state.units.length > 0) {
            const lost = Math.min(state.units.length, Math.floor(atkForce * 0.1));
            state.units.splice(0, lost);
            addLog('Потеряно юнитов: ' + lost, 'bad');
          }
          state.regolith = Math.max(0, state.regolith - 20);
        } else {
          addLog('Атака «Арес» отбита!', 'good');
        }
      }
    }

    // ============================

    });

      fragmentShader: `varying vec3 vN; void main() { float edge = 1.0 - abs(dot(vN, vec3(0.0, 0.0, 1.0))); float glow = pow(edge, 0.3) * 0.135; vec3 col = vec3(0.25, 0.55, 1.0) * glow; gl_FragColor = vec4(col, glow * 0.525); }`,
      side: THREE.BackSide, transparent: true, blending: THREE.AdditiveBlending, fog: false, depthWrite: false
    });
    earthGroup.add(new THREE.Mesh(new THREE.SphereGeometry(EARTH_R + 0.72, 24, 24), earthAtmoMat));

    // Дым над Землёй
    const smokeGeo = new THREE.BufferGeometry();

    for (let i = 0; i < sN; i++) {
      const r = EARTH_R + 0.18 + Math.random() * 0.84;

      const p = Math.acos(2 * Math.random() - 1);
      sP[i*3] = r * Math.sin(p) * Math.cos(t); sP[i*3+1] = r * Math.sin(p) * Math.sin(t); sP[i*3+2] = r * Math.cos(p);
    }
    smokeGeo.setAttribute('position', new THREE.BufferAttribute(sP, 3));

    const dN = 100, dP = new Float32Array(dN * 3);
    for (let i = 0; i < dN; i++) {
      const r = EARTH_R + 1.2 + Math.random() * 2.4;
      const t = Math.random() * Math.PI * 2;
      const p = Math.acos(2 * Math.random() - 1);
      dP[i*3] = r * Math.sin(p) * Math.cos(t); dP[i*3+1] = r * Math.sin(p) * Math.sin(t); dP[i*3+2] = r * Math.cos(p);
    }
    debrisGeo.setAttribute('position', new THREE.BufferAttribute(dP, 3));
    earthGroup.add(new THREE.Points(debrisGeo, new THREE.PointsMaterial({ color: 0x886655, size: 0.06, transparent: true, opacity: 0.55, fog: false })));

    // --- Свет ---
    scene.add(new THREE.AmbientLight(0x223344, 0.5));
    const sunLight = new THREE.DirectionalLight(0xddeeff, 1.3);
    sunLight.position.copy(sunPos);
    scene.add(sunLight);
    const earthShine = new THREE.DirectionalLight(0xff4422, 0.15);
    earthShine.position.copy(moonToEarth);
    scene.add(earthShine);
    scene.add(new THREE.AmbientLight(0x332222, 0.25));

    // --- Звёзды ---
    function makeStars(n, minR, maxR, color, size, opacity) {
      const geo = new THREE.BufferGeometry();
      const pos = new Float32Array(n * 3);
      for (let i = 0; i < n; i++) {
        const r = minR + Math.random() * (maxR - minR);
        const t = Math.random() * Math.PI * 2;
        const p = Math.acos(2 * Math.random() - 1);
        pos[i*3] = r * Math.sin(p) * Math.cos(t); pos[i*3+1] = r * Math.sin(p) * Math.sin(t); pos[i*3+2] = r * Math.cos(p);
      }
      geo.setAttribute('position', new THREE.BufferAttribute(pos, 3));
      return new THREE.Points(geo, new THREE.PointsMaterial({ color, size, transparent: true, opacity, fog: false }));
    }
    scene.add(makeStars(isMobile ? 900 : 1800, 100, 200, 0x8899cc, 0.14, 0.5));

    const LOD_LEVELS = isMobile

    const lodGeometries = LOD_LEVELS.map(lvl => new THREE.SphereGeometry(MOON_R, lvl.segs, lvl.segs));

      for (let i = 0; i < LOD_LEVELS.length; i++) {
        if (dist >= LOD_LEVELS[i].dist) { if (currentLOD !== i) { moonMesh.geometry = lodGeometries[i]; currentLOD = i; } return; }
      }
    }
    const moonTex = texLoader.load('textures/moon_color.jpg', () => { moonMat.map = moonTex; moonMat.color.set(0xffffff); moonMat.needsUpdate = true; onTextureDone(); }, undefined, (err) => { console.error('moon_color.jpg:', err); onTextureDone(); });
    moonTex.colorSpace = THREE.SRGBColorSpace; moonTex.anisotropy = isMobile ? 2 : 8; moonTex.generateMipmaps = true; moonTex.minFilter = THREE.LinearMipmapLinearFilter;

    // --- Маркеры объектов ---
    function latLonToVec3(lat, lon, radius) {
      const phi = (90 - lat) * Math.PI / 180;
      const theta = (lon + 180) * Math.PI / 180;
      return new THREE.Vector3(-radius * Math.sin(phi) * Math.cos(theta), radius * Math.cos(phi), radius * Math.sin(phi) * Math.sin(theta));
    }
    const markers = [];

    // --- Raycasting ---
    const raycaster = new THREE.Raycaster();

    // =====================

    function canAfford(cost) { for (let k in cost) if (state[k] === undefined || state[k] < cost[k]) return false; return true; }

    function fmtNum(n) { if (n >= 1000) return (n / 1000).toFixed(1) + 'к'; return Math.floor(n).toString(); }

    function updateUI() {
      document.getElementById('r-regolith').textContent = fmtNum(state.regolith);

    let activeTab = null;
    document.querySelectorAll('.tab-btn').forEach(btn => {
      btn.addEventListener('click', () => {

        document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));

    function renderPanel(tab) {
      const c = document.getElementById('panel-content');
      if (tab === 'build') {
        let html = '<div class="panel-title">Строительство</div><div class="build-grid">';
        Object.keys(BUILDINGS).forEach(id => {
          const b = BUILDINGS[id]; const aff = canAfford(b.cost); const inQueue = state.buildQueue.some(q => q.id === id);
          let costHtml = ''; const ck = { regolith: 'r', helium: 'h', energy: 'e', pop: 'p' };
          for (let k in b.cost) { const cls = ck[k] || ''; costHtml += '<span class="cost-' + cls + '">' + b.cost[k] + ' ' + (k === 'regolith' ? 'Рег' : k === 'helium' ? 'Гел' : k === 'energy' ? 'Эн' : k) + '</span>'; }
          html += '<div class="build-card ' + (aff ? 'affordable' : 'unaffordable') + (inQueue ? ' building' : '') + '" data-build="' + id + '"><div class="build-name">' + b.icon + ' ' + b.name + '</div><div class="build-desc">' + b.desc + '</div><div class="build-cost">' + costHtml + ' <span class="cost-l">⏱' + Math.ceil(b.buildTime / 1000) + 'с</span></div>' + (inQueue ? '<div class="build-timer"><div class="build-timer-fill" style="width:50%"></div></div>' : '') + '</div>';
        });
        html += '</div>';
        c.innerHTML = html;
        c.querySelectorAll('.build-card').forEach(card => {
          card.addEventListener('click', () => {
            const id = card.dataset.build; const b = BUILDINGS[id];
            if (!canAfford(b.cost)) { addLog('Недостаточно ресурсов', 'bad'); return; }
            if (state.buildQueue.some(q => q.id === id)) { addLog('Уже строится', 'warn'); return; }
            if (state.logistics < 1) { addLog('Недостаточно очков логистики', 'bad'); return; }
            spendCost(b.cost); state.logistics--;
            const speedMod = b.id === 'dreadnought' ? getMod('heavyBuildSpeed') || 1 : getMod('buildSpeed') || 1;
            state.buildQueue.push({ id: id, remaining: b.buildTime / speedMod, built: false, x: (Math.random() - 0.5) * 4, z: (Math.random() - 0.5) * 4 });
            addLog('Начато строительство: ' + b.name, 'good'); renderPanel('build');
          });
        });
      } else if (tab === 'units') {
        let html = '<div class="panel-title">Военная система</div>';
        html += '<div style="margin-bottom:8px;font-size:10px;color:#789;">Ваши юниты: ' + state.units.length + '</div>';
        html += '<div class="unit-grid">';
        Object.keys(UNITS).forEach(id => {
          const u = UNITS[id]; const aff = canAfford(u.cost);
          let costHtml = ''; const ck = { regolith: 'r', helium: 'h', energy: 'e' };
          for (let k in u.cost) { const cls = ck[k] || ''; costHtml += '<span class="cost-' + cls + '">' + u.cost[k] + ' ' + (k === 'regolith' ? 'Рег' : k === 'helium' ? 'Гел' : k === 'energy' ? 'Эн' : k) + '</span>'; }
          html += '<div class="unit-card ' + (aff ? 'affordable' : 'unaffordable') + '" data-unit="' + id + '"><div class="unit-name">' + u.icon + ' ' + u.name + '</div><div class="unit-desc">' + u.desc + '</div><div class="unit-stats"><div class="unit-stat"><span class="val">' + u.attack + '</span>Атака</div><div class="unit-stat"><span class="val">' + u.defense + '</span>Защита</div></div><div class="build-cost">' + costHtml + ' <span class="cost-p">👥' + u.popNeed + '</span></div></div>';
        });
        html += '</div>';
        html += '<div style="margin-top:10px;font-size:9px;color:#789;line-height:1.4;"><b style="color:#ff6644">Атака на «Арес»:</b><br><button id="btn-attack" style="margin-top:6px;padding:6px 12px;background:rgba(255,60,60,.15);border:1px solid rgba(255,80,80,.3);color:#ff8866;border-radius:5px;cursor:pointer;font-family:inherit;font-size:11px;">⚔ Атаковать колонию «Арес»</button></div>';
        c.innerHTML = html;
        c.querySelectorAll('.unit-card').forEach(card => {
          card.addEventListener('click', () => {
            const id = card.dataset.unit; const u = UNITS[id];
            if (!canAfford(u.cost)) { addLog('Недостаточно ресурсов', 'bad'); return; }
            const popUsed = state.units.reduce((s, un) => s + (UNITS[un.id]?.popNeed || 0), 0);
            if (state.pop < u.popNeed + popUsed) { addLog('Недостаточно населения', 'bad'); return; }
            spendCost(u.cost);
            const speedMod = u.type === 'heavy' ? getMod('heavyBuildSpeed') || 1 : getMod('buildSpeed') || 1;
            setTimeout(() => { state.units.push({ id: id, hp: u.defense * 2, attack: u.attack, defense: u.defense }); addLog('Юнит готов: ' + u.name, 'good'); updateUI(); }, u.buildTime / speedMod);
            addLog('Начато обучение: ' + u.name, 'good'); renderPanel('units');
          });
        });
        document.getElementById('btn-attack')?.addEventListener('click', () => attackAI());
      } else if (tab === 'politics') {
        let html = '<div class="panel-title">Политический строй</div>';
        html += '<div style="margin-bottom:8px;font-size:10px;color:#789;">Полит. очки: <b style="color:#ff44ff">' + Math.floor(state.politicalPoints) + '</b> / ' + state.ppMax + '</div>';
        html += '<div class="pol-grid">';
        Object.keys(REGIMES).forEach(id => {
          const r = REGIMES[id]; const isCur = state.regime === id; const canChange = !isCur && state.politicalPoints >= r.ppCost;
          const cls = isCur ? 'current' : canChange ? '' : 'unaffordable';
          html += '<div class="pol-card ' + cls + '" data-regime="' + id + '"><div class="pol-name">' + r.name + '</div><div class="pol-pros">' + r.pros.replace(/\n/g, '<br>') + '</div><div class="pol-cons">' + r.cons.replace(/\n/g, '<br>') + '</div>' + (isCur ? '' : '<div class="pp-cost">Стоимость: ' + r.ppCost + ' ПО</div>') + '</div>';
        });
        html += '</div>';
        html += '<div style="margin-top:10px;font-size:9px;color:#789;line-height:1.4;">Смена строя вызывает <b style="color:#ff4444">политическую нестабильность</b> на 5 минут: добыча ресурсов −50%.</div>';
        c.innerHTML = html;
        c.querySelectorAll('.pol-card').forEach(card => {
          card.addEventListener('click', () => {
            const id = card.dataset.regime; if (id === state.regime) return;
            const r = REGIMES[id];
            if (state.politicalPoints < r.ppCost) { addLog('Недостаточно полит. очков', 'bad'); return; }
            state.politicalPoints -= r.ppCost; state.regime = id;
            state.debuffEnd = Date.now() + 300000; state.debuffType = 'instability';
            addLog('Смена строя: ' + r.name + '. Нестабильность 5 минут!', 'warn'); renderPanel('politics');
          });
        });
      } else if (tab === 'map') {
        let html = '<div class="panel-title">Карта Луны</div><div style="font-size:10px;color:#789;line-height:1.6;">';
        html += '<div style="margin-bottom:6px;">Зданий: <b style="color:#00e5ff">' + state.buildings.filter(b => b.built).length + '</b></div>';
        html += '<div style="margin-bottom:6px;">Юнитов: <b style="color:#ff8844">' + state.units.length + '</b></div>';
        html += '<div style="margin-bottom:6px;">Время игры: <b style="color:#00e5ff">' + Math.floor(state.gameTime / 60) + ' мин</b></div>';
        html += '<div style="margin-bottom:6px;">Текущий строй: <b style="color:#ff44ff">' + REGIMES[state.regime].name + '</b></div>';
        html += '<div style="margin-bottom:10px;">ИИ «Арес»: <b style="color:#ff4444">' + state.ai.buildings + ' зданий, ' + state.ai.units + ' юнитов</b></div>';
        html += '</div>';
        html += '<button id="btn-save" style="padding:8px 14px;background:rgba(0,229,255,.1);border:1px solid rgba(0,229,255,.25);color:#00e5ff;border-radius:5px;cursor:pointer;font-family:inherit;font-size:11px;margin-right:6px;">💾 Сохранить</button>';
        html += '<button id="btn-reset" style="padding:8px 14px;background:rgba(255,60,60,.1);border:1px solid rgba(255,80,80,.25);color:#ff6666;border-radius:5px;cursor:pointer;font-family:inherit;font-size:11px;">🗑 Новая игра</button>';
        c.innerHTML = html;
        document.getElementById('btn-save')?.addEventListener('click', () => { saveGame(); addLog('Игра сохранена', 'good'); });
        document.getElementById('btn-reset')?.addEventListener('click', () => { if (confirm('Начать новую игру? Весь прогресс будет потерян.')) { resetGame(); renderPanel('map'); } });
      } else if (tab === 'info') {
        let html = '<div class="panel-title">Луна 2087: Рассвет</div><div style="font-size:11px;color:#aacce6;line-height:1.6;">';
        html += '<p style="margin-bottom:8px;">2087 год. Земля погибла — атмосфера горит уже 16 лет. Последние люди выживают в колониях на Луне.</p>';
        html += '<p style="margin-bottom:8px;"><b style="color:#00e5ff">Ресурсы:</b><br>• <b style="color:#ffaa44">Реголит</b> — строительный материал, добывается в шахтах<br>• <b style="color:#7fff7f">Гелий-3</b> — топливо для реакторов, добывается в шахтах<br>• <b style="color:#44aaff">Энергия</b> — если потребление выше выработки, база отключается<br>• <b style="color:#ff66aa">Население</b> — выращивается в лабораториях, нужно для шахт и юнитов<br>• <b style="color:#ff44ff">Полит. очки</b> — генерируются куполами, нужны для реформ<br>• <b style="color:#ff8844">Логистика</b> — тратится на стройку, восстанавливается со временем</p>';
        html += '<p style="margin-bottom:8px;"><b style="color:#00e5ff">Строи:</b><br>• <b>Технократия</b> — +30% исследования, шахты без людей<br>• <b>Военная Хунта</b> — +40% скорость войск, −25% ресурсы<br>• <b>Корпоратократия</b> — +50% торговля, +реголит<br>• <b>Социал-Коллективизм</b> — −50% содержание, медленные технологии</p>';
        html += '<p style="margin-bottom:8px;"><b style="color:#00e5ff">Юниты:</b><br>• <b>Строитель</b> — строит/ремонтирует, беззащитен<br>• <b>Штурмовик</b> — космопехота, захват аванпостов<br>• <b>Дредноут</b> — танк на Гелии-3, огромная мощь</p>';
        html += '<p style="font-size:9px;color:#456;margin-top:10px;">Оффлайн-режим: ИИ управляет колонией «Арес». Архитектура готова к переходу в онлайн.</p></div>';
        c.innerHTML = html;
      }
    }

    function attackAI() {
      if (state.units.length < 3) { addLog('Недостаточно юнитов для атаки (нужно 3+)', 'bad'); return; }
      const myPower = state.units.reduce((s, u) => s + u.attack, 0);
      const aiDef = state.ai.units * 8 + state.ai.buildings * 5;
      if (myPower > aiDef * 0.8) {
        const lost = Math.floor(state.units.length * 0.3); state.units.splice(0, lost);
        const gain = Math.floor(state.ai.regolith * 0.3) + Math.floor(state.ai.helium * 0.2);
        state.regolith += gain; state.ai.buildings = Math.max(0, state.ai.buildings - 1); state.ai.units = Math.max(0, state.ai.units - 3);
        addLog('Победа! Захвачено ресурсов: ' + gain + '. Потеряно юнитов: ' + lost, 'good');
      } else {
        const lost = Math.floor(state.units.length * 0.6); state.units.splice(0, lost);
        addLog('Поражение! Потеряно юнитов: ' + lost, 'bad');
      }
      updateUI();
    }

    // =====================
    // === ГЛАВНЫЙ ЦИКЛ ====
    // =====================
    let lastTime = performance.now();
    const clock = new THREE.Clock();
    const earthRotSpeed = 0.000476;
    const moonRotSpeed = earthRotSpeed * 0.95;

    function animate() {
      requestAnimationFrame(animate);
      const now = performance.now();
      const dt = Math.min(0.1, (now - lastTime) / 1000);
      lastTime = now;
      const t = clock.getElapsedTime();

      gameTick(dt);

      earthAtmoMat.uniforms.uTime.value = t;

      markers.forEach((m, i) => {
        const pulse = 1 + Math.sin(t * 3 + i * 0.7) * 0.2;
        if (m.userData.glow) { m.userData.glow.scale.setScalar(pulse); m.userData.glow.material.opacity = 0.15 + Math.sin(t * 3 + i * 0.7) * 0.1; }
      });

      const camDir = camera.position.clone().normalize();
      bgSphere.rotation.y = -camDir.x * 0.04;
      bgSphere.rotation.x = camDir.y * 0.03;
      bgSphere.rotation.z = camDir.x * 0.015;

      if (Date.now() - lastInteract > 30000) controls.autoRotate = true;
      if (controls.autoRotate) { moonGroup.rotation.y += moonRotSpeed; earthGroup.rotation.y += earthRotSpeed; }

      updateLOD();
      controls.update();
      renderer.render(scene, camera);

      if (Math.floor(t * 2) !== Math.floor((t - dt) * 2)) updateUI();
    }

    addEventListener('resize', () => {
      camera.aspect = innerWidth / innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(innerWidth, innerHeight);
      renderer.setPixelRatio(Math.min(devicePixelRatio, isMobile ? 1.5 : 2));
    });
    addEventListener('beforeunload', saveGame);

    updateUI();
    animate();
    addLog('Луна 2087: Рассвет запущена', 'good');
  </script>
</body>
</html>
