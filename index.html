    let audioCtx = null;

    function initAudio() {
      if (audioCtx) return;
      try {
        audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        masterGain = audioCtx.createGain();
        musicGain = audioCtx.createGain();
        sfxGain = audioCtx.createGain();
        masterGain.connect(audioCtx.destination);
        musicGain.connect(masterGain);
        sfxGain.connect(masterGain);
        applyAudioSettings();
      } catch(e) { console.warn('Audio init failed', e); }
    }

    function applyAudioSettings() {
      if (!audioCtx) return;
      const vol = settings.muted ? 0 : settings.master;
      masterGain.gain.setTargetAtTime(vol, audioCtx.currentTime, 0.05);
      musicGain.gain.setTargetAtTime(settings.music && !settings.muted ? 1 : 0, audioCtx.currentTime, 0.05);
      sfxGain.gain.setTargetAtTime(settings.sfx && !settings.muted ? 1 : 0, audioCtx.currentTime, 0.05);
    }

    function saveSettings() { localStorage.setItem('luna_settings', JSON.stringify(settings)); }

    function playSfx(freq, dur, type) {
      if (!audioCtx || !settings.sfx || settings.muted) return;
      type = type || 'sine';
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.type = type;
      osc.frequency.value = freq;
      gain.gain.setValueAtTime(0.0001, audioCtx.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.3, audioCtx.currentTime + 0.01);
      gain.gain.exponentialRampToValueAtTime(0.0001, audioCtx.currentTime + dur);
      osc.connect(gain); gain.connect(sfxGain);
      osc.start(); osc.stop(audioCtx.currentTime + dur);
    }
    function sfxClick() { playSfx(800, 0.05, 'square'); }
    function sfxBuild() { playSfx(400, 0.15, 'sawtooth'); setTimeout(() => playSfx(600, 0.1, 'sawtooth'), 100); }
    function sfxError() { playSfx(200, 0.1, 'square'); }
    function sfxCombat() { playSfx(150, 0.2, 'sawtooth'); setTimeout(() => playSfx(80, 0.3, 'sawtooth'), 150); }

    function startMusic() {
      if (!audioCtx || musicNodes.length > 0) return;
      const baseFreq = 55; // A1
      const intervals = [1, 1.5, 2, 2.5, 3, 4];
      intervals.forEach((mult, i) => {
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        const lfo = audioCtx.createOscillator();
        const lfoGain = audioCtx.createGain();
        osc.type = i < 2 ? 'sine' : 'triangle';
        osc.frequency.value = baseFreq * mult;
        lfo.frequency.value = 0.05 + i * 0.02;
        lfoGain.gain.value = 0.003;
        gain.gain.value = 0.015 / (i + 1);
        lfo.connect(lfoGain);
        lfoGain.connect(gain.gain);
        osc.connect(gain);
        gain.connect(musicGain);
        osc.start(); lfo.start();
        musicNodes.push(osc, lfo, gain);
      });
    }

    function stopMusic() {
      musicNodes.forEach(n => { try { if (n.stop) n.stop(); } catch(e){} try { n.disconnect(); } catch(e){} });

    const SAVE_KEY = 'luna2087_newfrontier_save';
    function defaultState() {

    try {

      if (saved) { state = JSON.parse(saved); const d = defaultState(); for (let k in d) if (state[k] === undefined) state[k] = d[k]; }
      else state = defaultState();
    } catch (e) { state = defaultState(); }

    function getMod(key) {
      // Check anarchy debuff first
      if (state.debuffEnd > Date.now() && state.debuffType === 'anarchy') {
        if (key === 'globalProduction' || key === 'regolithRate' || key === 'heliumRate' || key === 'popRate' || key === 'ppRate') return 0.5;
        if (key === 'unitLock') return true;
      }
      const mods = REGIMES[state.regime].mods || {};
      let m = mods[key] !== undefined ? mods[key] : 1;
      // Also apply build cost mod
      return m;
    }

    function isUnitLocked() {
      return state.debuffEnd > Date.now() && state.debuffType === 'anarchy';
    }

    function addLog(msg, type) {
      const logEl = document.getElementById('log');
      const div = document.createElement('div');
      div.className = 'log-msg' + (type ? ' ' + type : '');
      div.textContent = msg;
      logEl.appendChild(div);
      setTimeout(() => div.remove(), 8000);
      while (logEl.children.length > 5) logEl.removeChild(logEl.firstChild);
    }

    // =====================
    // === ИГРОВОЙ ТИК ===

    function gameTick(dt) {
      let regRate = 0, helRate = 0, energyProd = 0, energyCons = 0, ppRate = 0, popRate = 0;
      state.buildings.forEach(b => {
        if (!b.built) return;
        const def = BUILDINGS[b.id];
        if (def.regolithRate) regRate += def.regolithRate * getMod('regolithRate');
        if (def.heliumRate)   helRate += def.heliumRate * getMod('heliumRate');
        if (def.ppRate)       ppRate += def.ppRate * getMod('ppRate');
        if (def.popRate)      popRate += def.popRate * getMod('popRate');
        if (def.energyUse)    energyCons += def.energyUse;
        if (b.id === 'dome')  energyProd += 2;
      });
      // Apply global production penalty from anarchy
      if (state.debuffEnd > Date.now() && state.debuffType === 'anarchy') {
        regRate *= 0.5; helRate *= 0.5; ppRate *= 0.5; popRate *= 0.5;
      }
      state.energy = Math.min(state.energyMax, state.energy + energyProd * dt * 0.1);
      energyCons += state.units.length * 0.5;
      state.energy = Math.max(0, state.energy - energyCons * dt * 0.01);
      state.regolith = Math.min(9999, state.regolith + regRate * dt);
      state.helium = Math.min(9999, state.helium + helRate * dt);
      state.politicalPoints = Math.min(state.ppMax, state.politicalPoints + ppRate * dt);
      state.pop = Math.min(state.popMax, state.pop + popRate * dt);
      state.logistics = Math.min(state.logisticsMax, state.logistics + dt * 0.01);

      state.buildQueue.forEach(q => {
        q.remaining -= dt * 1000;
        if (q.remaining <= 0) {
          q.built = true;
          state.buildings.push({ id: q.id, x: q.x, z: q.z, built: true, progress: 1 });
          addLog(t('built_done') + BUILDINGS[q.id].nameKey.split('_').map(w => w[0].toUpperCase()+w.slice(1)).join(' '), 'good');
          sfxBuild();
        }
      });
      state.buildQueue = state.buildQueue.filter(q => q.remaining > 0);

      aiTick(dt);

      if (state.debuffEnd <= Date.now() && state.debuffType) {
        state.debuffType = null;
        addLog(t('instability_end'), 'good');
      }

      state.gameTime += dt;
      if (state.gameTime % 30 < dt) saveGame();
    }

    function aiTick(dt) {
      const ai = state.ai;
      ai.regolith += 0.3 * dt; ai.helium += 0.1 * dt;
      ai.pop = Math.min(ai.popMax, ai.pop + 0.05 * dt);
      if (Math.random() < 0.001 * dt && ai.buildings < 10) {
        ai.buildings++; ai.regolith -= 40; ai.helium -= 10;
        addLog(t('ared_built') + t('ared_bldg'), 'warn');
      }
      if (Math.random() < 0.0008 * dt && ai.units < 20) {
        ai.units++; ai.regolith -= 25;
        if (Math.random() < 0.3) addLog(t('ared_forces'), 'warn');
      }
      if (ai.units >= 5 && Math.random() < ai.aggression * 0.0003 * dt) {
        const atkForce = Math.min(ai.units, Math.floor(ai.units * 0.6));
        ai.units -= atkForce;
        const myDef = state.units.reduce((s, u) => s + u.defense, 0) + state.buildings.reduce((s, b) => s + (BUILDINGS[b.id]?.defense || 0), 0);
        if (atkForce * 10 > myDef) {
          addLog(t('ared_attack') + Math.floor(atkForce * 0.3) + t('ared_unit'), 'bad');
          sfxCombat();
          if (state.units.length > 0) {
            const lost = Math.min(state.units.length, Math.floor(atkForce * 0.1));
            state.units.splice(0, lost);
            addLog(t('ared_attack_lost') + lost, 'bad');
          }
          state.regolith = Math.max(0, state.regolith - 20);
        } else {
          addLog(t('ared_repelled'), 'good');

      }
    }

    // ============================
    // === 3D СЦЕНА (ПОЛНАЯ) ======
    // ============================
    const isMobile = /Android|iPhone|iPad|iPod|BlackBerry|IEMobile|Opera Mini/i.test(navigator.userAgent);

    // --- Текстуры ---

    // --- Фон: Млечный Путь ---

    });

    const earthMat = new THREE.ShaderMaterial({
      uniforms: { uLightDir: { value: earthToSun }, uMoonDir: { value: earthToMoon }, uTexture: { value: earthColorTex } },
      vertexShader: `varying vec3 vN; varying vec2 vUv; void main() { vN = normalize(mat3(modelMatrix) * normal); vUv = uv; gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0); }`,
      fragmentShader: `uniform vec3 uLightDir; uniform vec3 uMoonDir; uniform sampler2D uTexture; varying vec3 vN; varying vec2 vUv; void main() { vec3 texColor = texture2D(uTexture, vUv).rgb; float light = max(dot(normalize(vN), uLightDir), 0.0); vec3 color = texColor * (light * 0.97 + 0.08); color *= 0.679; vec3 fireColor = vec3(0.7, 0.15, 0.03); float fireAmount = light * 0.0648; color = mix(color, color + fireColor * fireAmount, step(0.01, light)); float moonAlign = max(dot(normalize(vN), uMoonDir), 0.0); float shadow = smoothstep(0.88, 0.99, moonAlign) * light * 0.55; color *= (1.0 - shadow); gl_FragColor = vec4(color, 1.0); }`
    });
    const earthSegs = isMobile ? 48 : 96;
    earthGroup.add(new THREE.Mesh(new THREE.SphereGeometry(EARTH_R, earthSegs, earthSegs), earthMat));

    const earthAtmoMat = new THREE.ShaderMaterial({

      fragmentShader: `varying vec3 vN; void main() { float edge = 1.0 - abs(dot(vN, vec3(0.0, 0.0, 1.0))); float glow = pow(edge, 0.3) * 0.135; vec3 col = vec3(0.25, 0.55, 1.0) * glow; gl_FragColor = vec4(col, glow * 0.525); }`,

    }

    const dN = 100, dP = new Float32Array(dN * 3);
    for (let i = 0; i < dN; i++) {
      const r = EARTH_R + 1.2 + Math.random() * 2.4;
      const ta = Math.random() * Math.PI * 2;
      const pa = Math.acos(2 * Math.random() - 1);
      dP[i*3] = r * Math.sin(pa) * Math.cos(ta); dP[i*3+1] = r * Math.sin(pa) * Math.sin(ta); dP[i*3+2] = r * Math.cos(pa);
    }
    debrisGeo.setAttribute('position', new THREE.BufferAttribute(dP, 3));
    earthGroup.add(new THREE.Points(debrisGeo, new THREE.PointsMaterial({ color: 0x886655, size: 0.06, transparent: true, opacity: 0.55, fog: false })));

    // --- Свет ---
    scene.add(new THREE.AmbientLight(0x223344, 0.5));
    const sunLight = new THREE.DirectionalLight(0xddeeff, 1.3);
    sunLight.position.copy(sunPos);
    scene.add(sunLight);
    const earthShine = new THREE.DirectionalLight(0xff4422, 0.15);
    earthShine.position.copy(moonToEarth);
    scene.add(earthShine);
    scene.add(new THREE.AmbientLight(0x332222, 0.25));

    // --- Звёзды ---
    function makeStars(n, minR, maxR, color, size, opacity) {
      const geo = new THREE.BufferGeometry();
      const pos = new Float32Array(n * 3);
      for (let i = 0; i < n; i++) {
        const r = minR + Math.random() * (maxR - minR);
        const ta = Math.random() * Math.PI * 2;
        const pa = Math.acos(2 * Math.random() - 1);
        pos[i*3] = r * Math.sin(pa) * Math.cos(ta); pos[i*3+1] = r * Math.sin(pa) * Math.sin(ta); pos[i*3+2] = r * Math.cos(pa);
      }
      geo.setAttribute('position', new THREE.BufferAttribute(pos, 3));
      return new THREE.Points(geo, new THREE.PointsMaterial({ color, size, transparent: true, opacity, fog: false }));
    }
    scene.add(makeStars(isMobile ? 900 : 1800, 100, 200, 0x8899cc, 0.14, 0.5));
    scene.add(makeStars(isMobile ? 150 : 300, 80, 120, 0xff6633, 0.1, 0.25));

    // --- Луна с LOD ---
    const MOON_R = 2.2;
    const moonGroup = new THREE.Group();
    scene.add(moonGroup);
    const moonMat = new THREE.MeshStandardMaterial({ color: 0x888888, roughness: 1.0, metalness: 0.0 });
    const LOD_LEVELS = isMobile
      ? [{ dist: 20, segs: 32 }, { dist: 10, segs: 64 }, { dist: 4, segs: 96 }, { dist: 0, segs: 128 }]
      : [{ dist: 8, segs: 48 }, { dist: 3, segs: 96 }, { dist: 0, segs: 128 }];
    const lodGeometries = LOD_LEVELS.map(lvl => new THREE.SphereGeometry(MOON_R, lvl.segs, lvl.segs));
    const moonMesh = new THREE.Mesh(lodGeometries[lodGeometries.length - 1], moonMat);
    moonGroup.add(moonMesh);
    let currentLOD = lodGeometries.length - 1;
    function updateLOD() {
      const dist = camera.position.length() - MOON_R;
      for (let i = 0; i < LOD_LEVELS.length; i++) {
        if (dist >= LOD_LEVELS[i].dist) { if (currentLOD !== i) { moonMesh.geometry = lodGeometries[i]; currentLOD = i; } return; }
      }
    }
    const moonTex = texLoader.load('textures/moon_color.jpg', () => { moonMat.map = moonTex; moonMat.color.set(0xffffff); moonMat.needsUpdate = true; onTextureDone(); }, undefined, () => onTextureDone());
    moonTex.colorSpace = THREE.SRGBColorSpace; moonTex.anisotropy = isMobile ? 2 : 8; moonTex.generateMipmaps = true; moonTex.minFilter = THREE.LinearMipmapLinearFilter;

    // --- Маркеры ---
    function latLonToVec3(lat, lon, radius) {
      const phi = (90 - lat) * Math.PI / 180;
      const theta = (lon + 180) * Math.PI / 180;
      return new THREE.Vector3(-radius * Math.sin(phi) * Math.cos(theta), radius * Math.cos(phi), radius * Math.sin(phi) * Math.sin(theta));
    }
    const markers = [];
    const glowMeshes = [];
    const OBJ_DATA = [
      { title: 'Главная База', lat: 0, lon: 0, cat: 'base' },
      { title: 'Шахта Альфа', lat: 15, lon: 30, cat: 'mine' },
      { title: 'Шахта Коперник', lat: 10, lon: -20, cat: 'mine' },
      { title: 'Шахта Полярная', lat: -82, lon: 0, cat: 'mine' },
      { title: 'Лаборатория Путь', lat: -42, lon: 12, cat: 'lab' },
      { title: 'Лаборатория Тень', lat: 52, lon: 80, cat: 'lab' },
      { title: 'Маяк Орёл', lat: 8, lon: 0, cat: 'beacon' },
      { title: 'Маяк Северный', lat: 78, lon: 45, cat: 'beacon' },
      { title: 'Маяк Тихий', lat: -60, lon: 180, cat: 'beacon' },
      { title: 'Аванпост Юг', lat: -30, lon: 60, cat: 'outpost' },
      { title: 'Аванпост Запад', lat: 20, lon: -50, cat: 'outpost' },
      { title: 'Колония Арес (ИИ)', lat: -15, lon: 145, cat: 'enemy' },
    ];
    const CAT_COLORS = { base: 0x00ff88, mine: 0xffaa44, lab: 0x7fff7f, beacon: 0xff44ff, outpost: 0x66aaff, enemy: 0xff4444 };
    OBJ_DATA.forEach(o => {
      const pos = latLonToVec3(o.lat, o.lon, MOON_R * 1.02);
      const col = CAT_COLORS[o.cat] || 0x00e5ff;
      const m = new THREE.Mesh(new THREE.SphereGeometry(o.cat === 'base' ? 0.08 : 0.05, 12, 12), new THREE.MeshBasicMaterial({ color: col }));
      m.position.copy(pos); m.userData = o;
      const glow = new THREE.Mesh(new THREE.SphereGeometry(o.cat === 'base' ? 0.15 : 0.11, 12, 12), new THREE.MeshBasicMaterial({ color: col, transparent: true, opacity: 0.25, blending: THREE.AdditiveBlending, depthWrite: false }));
      glow.position.copy(pos); m.userData.glow = glow;
      moonGroup.add(m); moonGroup.add(glow); markers.push(m); glowMeshes.push(glow);
    });

    // --- Raycasting ---
    const raycaster = new THREE.Raycaster();
    const pointer = new THREE.Vector2();
    let pDown = null, pTime = 0;
    renderer.domElement.addEventListener('pointerdown', e => { pDown = { x: e.clientX, y: e.clientY }; pTime = Date.now(); });
    renderer.domElement.addEventListener('pointerup', e => {
      if (!pDown) return;
      const dx = e.clientX - pDown.x, dy = e.clientY - pDown.y;
      if (Math.sqrt(dx * dx + dy * dy) < 8 && Date.now() - pTime < 400) {
        pointer.x = e.clientX / innerWidth * 2 - 1;
        pointer.y = -(e.clientY / innerHeight) * 2 + 1;
        raycaster.setFromCamera(pointer, camera);
        const hits = raycaster.intersectObjects(markers);
        if (hits.length > 0) { addLog(t('selected') + hits[0].object.userData.title); sfxClick(); }
      }
      pDown = null;
    });
    if (!isMobile) {
      renderer.domElement.addEventListener('pointermove', e => {
        if (e.buttons > 0) return;
        pointer.x = e.clientX / innerWidth * 2 - 1;
        pointer.y = -(e.clientY / innerHeight) * 2 + 1;
        raycaster.setFromCamera(pointer, camera);
        const hits = raycaster.intersectObjects(markers);
        renderer.domElement.style.cursor = hits.length > 0 ? 'pointer' : 'grab';
      });
    }

    // --- OrbitControls ---
    const controls = new OrbitControls(camera, renderer.domElement);
    controls.enableDamping = true; controls.dampingFactor = 0.07;
    controls.minDistance = 3.5; controls.maxDistance = isMobile ? 28 : 14;
    controls.enablePan = false; controls.rotateSpeed = 0.55;
    controls.autoRotate = true; controls.autoRotateSpeed = 0.35;

    let lastInteract = Date.now();
    renderer.domElement.addEventListener('pointerdown', () => { controls.autoRotate = false; lastInteract = Date.now(); });
    renderer.domElement.addEventListener('touchstart', () => { controls.autoRotate = false; lastInteract = Date.now(); }, { passive: true });

    document.getElementById('btn-zoom-in').addEventListener('click', () => { sfxClick(); const d = camera.position.length(); camera.position.multiplyScalar(Math.max(controls.minDistance, d - (isMobile ? 2.4 : 1.6)) / d); controls.update(); });
    document.getElementById('btn-zoom-out').addEventListener('click', () => { sfxClick(); const d = camera.position.length(); camera.position.multiplyScalar(Math.min(controls.maxDistance, d + (isMobile ? 2.4 : 1.6)) / d); controls.update(); });
    document.getElementById('btn-reset').addEventListener('click', () => { sfxClick(); if (isMobile) camera.position.set(MOBILE_CAM.x, MOBILE_CAM.y, MOBILE_CAM.z); else camera.position.set(DESKTOP_CAM.x, DESKTOP_CAM.y, DESKTOP_CAM.z); controls.target.set(0, 0, 0); controls.autoRotate = true; controls.update(); });

    // =====================
    // === ИНТЕРФЕЙС =======
    // =====================
    function canAfford(cost) {
      // Apply build cost modifier
      const costMod = getMod('buildCost') || 1;
      for (let k in cost) { const c = Math.ceil(cost[k] * costMod); if (state[k] === undefined || state[k] < c) return false; }
      return true;
    }
    function spendCost(cost) {
      const costMod = getMod('buildCost') || 1;
      for (let k in cost) state[k] -= Math.ceil(cost[k] * costMod);
    }
    function getUnitCost(cost) {
      const costMod = getMod('unitCost') || 1;
      const r = {}; for (let k in cost) r[k] = Math.ceil(cost[k] * costMod); return r;
    }
    function canAffordUnit(cost) {
      const c = getUnitCost(cost);
      for (let k in c) if (state[k] === undefined || state[k] < c[k]) return false; return true;
    }
    function spendUnitCost(cost) {
      const c = getUnitCost(cost); for (let k in c) state[k] -= c[k];
    }
    function fmtNum(n) { if (n >= 1000) return (n / 1000).toFixed(1) + 'к'; return Math.floor(n).toString(); }

    function updateUI() {
      document.getElementById('r-regolith').textContent = fmtNum(state.regolith);
      document.getElementById('r-helium').textContent = fmtNum(state.helium);
      let eProd = 0, eUse = 0;
      state.buildings.forEach(b => { if (!b.built) return; const d = BUILDINGS[b.id]; if (d.energyUse) eUse += d.energyUse; if (b.id === 'dome') eProd += 2; });
      eUse += state.units.length * 0.5;
      document.getElementById('r-energy').textContent = Math.floor(state.energy) + '/' + state.energyMax;
      document.getElementById('r-energy').parentElement.classList.toggle('low', state.energy < eUse);
      document.getElementById('r-pop').textContent = Math.floor(state.pop) + '/' + state.popMax;
      document.getElementById('r-pp').textContent = Math.floor(state.politicalPoints);
      document.getElementById('r-logistics').textContent = Math.floor(state.logistics) + '/' + state.logisticsMax;
      const db = document.getElementById('debuff-bar');
      if (state.debuffEnd > Date.now()) { const min2 = Math.ceil((state.debuffEnd - Date.now()) / 60000); db.textContent = t('instability') + min2 + t('min'); db.classList.add('show'); }
      else db.classList.remove('show');
      document.getElementById('ai-panel-info').textContent = t('buildings_count').replace(': ','') + state.ai.buildings + ' | ' + (currentLang==='en'?'Units:':'Войска: ') + state.ai.units + ' | ' + (currentLang==='en'?'Pop:':'Нас: ') + Math.floor(state.ai.pop);
    }

    let activeTab = null;
    document.querySelectorAll('.tab-btn').forEach(btn => {
      btn.addEventListener('click', () => { sfxClick();
        const tab = btn.dataset.tab;
        if (activeTab === tab) { document.getElementById('panel').classList.remove('show'); btn.classList.remove('active'); activeTab = null; return; }
        document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));

        document.getElementById('panel').classList.add('show');
        renderPanel(tab);
      });
    });

    // --- Settings button ---

      document.getElementById('panel').classList.add('show');
      renderPanel('settings');
    });

    function renderPanel(tab) {
      const c = document.getElementById('panel-content');
      if (tab === 'build') {
        let html = '<div class="panel-title">' + t('build_title') + '</div><div class="build-grid">';
        Object.keys(BUILDINGS).forEach(id => {
          const b = BUILDINGS[id]; const aff = canAfford(b.cost); const inQueue = state.buildQueue.some(q => q.id === id);
          let costHtml = ''; const ck = { regolith: 'r', helium: 'h', energy: 'e' };
          const costMod = getMod('buildCost') || 1;
          for (let k in b.cost) { const cls = ck[k] || ''; const v = Math.ceil(b.cost[k] * costMod); costHtml += '<span class="cost-' + cls + '">' + v + ' ' + t(k + '_short') + '</span>'; }
          const timeStr = Math.ceil(b.buildTime / 1000) + t('time_short');
          html += '<div class="build-card ' + (aff ? 'affordable' : 'unaffordable') + (inQueue ? ' building' : '') + '" data-build="' + id + '"><div class="build-name">' + b.icon + ' ' + t(b.nameKey) + '</div><div class="build-desc">' + t(b.descKey) + '</div><div class="build-cost">' + costHtml + ' <span class="cost-l">⏱' + timeStr + '</span></div>' + (inQueue ? '<div class="build-timer"><div class="build-timer-fill" style="width:50%"></div></div>' : '') + '</div>';
        });
        html += '</div>';
        c.innerHTML = html;
        c.querySelectorAll('.build-card').forEach(card => {
          card.addEventListener('click', () => {
            const id = card.dataset.build; const b = BUILDINGS[id];
            if (!canAfford(b.cost)) { addLog(t('not_enough_res'), 'bad'); sfxError(); return; }
            if (state.buildQueue.some(q => q.id === id)) { addLog(t('already_building'), 'warn'); return; }
            if (state.logistics < 1) { addLog(t('not_enough_log'), 'bad'); sfxError(); return; }
            spendCost(b.cost); state.logistics--;
            const speedMod = b.id === 'dreadnought' ? getMod('heavyBuildSpeed') || 1 : getMod('buildSpeed') || 1;
            state.buildQueue.push({ id: id, remaining: b.buildTime / speedMod, built: false, x: (Math.random() - 0.5) * 4, z: (Math.random() - 0.5) * 4 });
            addLog(t('started_build') + t(b.nameKey), 'good'); sfxBuild(); renderPanel('build');
          });
        });
      } else if (tab === 'units') {
        const locked = isUnitLocked();
        let html = '<div class="panel-title">' + t('unit_title') + '</div>';
        if (locked) html += '<div style="margin-bottom:8px;font-size:10px;color:#ff4444;">' + t('units_locked') + '</div>';
        html += '<div style="margin-bottom:8px;font-size:10px;color:#789;">' + t('your_units') + ': ' + state.units.length + '</div>';
        html += '<div class="unit-grid">';
        Object.keys(UNITS).forEach(id => {
          const u = UNITS[id]; const aff = canAffordUnit(u.cost);
          const cls = locked ? 'locked' : (aff ? 'affordable' : 'unaffordable');
          let costHtml = ''; const ck = { regolith: 'r', helium: 'h', energy: 'e' };
          const uc = getUnitCost(u.cost);
          for (let k in uc) { const cl = ck[k] || ''; costHtml += '<span class="cost-' + cl + '">' + uc[k] + ' ' + t(k + '_short') + '</span>'; }
          html += '<div class="unit-card ' + cls + '" data-unit="' + id + '"><div class="unit-name">' + u.icon + ' ' + t(u.nameKey) + '</div><div class="unit-desc">' + t(u.descKey) + '</div><div class="unit-stats"><div class="unit-stat"><span class="val">' + u.attack + '</span>' + t('attack') + '</div><div class="unit-stat"><span class="val">' + u.defense + '</span>' + t('defense') + '</div></div><div class="build-cost">' + costHtml + ' <span class="cost-p">👥' + u.popNeed + '</span></div></div>';
        });
        html += '</div>';
        html += '<div style="margin-top:10px;font-size:9px;color:#789;line-height:1.4;"><b style="color:#ff6644">' + (currentLang==='en'?'Attack "Ares":':'Атака на «Арес»:') + '</b><br><button id="btn-attack" style="margin-top:6px;padding:6px 12px;background:rgba(255,60,60,.15);border:1px solid rgba(255,80,80,.3);color:#ff8866;border-radius:5px;cursor:pointer;font-family:inherit;font-size:11px;">' + t('attack_ares') + '</button></div>';
        c.innerHTML = html;
        if (!locked) {
          c.querySelectorAll('.unit-card').forEach(card => {
            card.addEventListener('click', () => {
              const id = card.dataset.unit; const u = UNITS[id];
              if (!canAffordUnit(u.cost)) { addLog(t('not_enough_res'), 'bad'); sfxError(); return; }
              const popUsed = state.units.reduce((s, un) => s + (UNITS[un.id]?.popNeed || 0), 0);
              if (state.pop < u.popNeed + popUsed) { addLog(t('not_enough_pop'), 'bad'); sfxError(); return; }
              spendUnitCost(u.cost);
              const speedMod = u.type === 'heavy' ? getMod('heavyBuildSpeed') || 1 : getMod('buildSpeed') || 1;
              setTimeout(() => { state.units.push({ id: id, hp: u.defense * 2, attack: u.attack, defense: u.defense }); addLog(t('unit_ready') + t(u.nameKey), 'good'); sfxBuild(); updateUI(); }, u.buildTime / speedMod);
              addLog(t('started_training') + t(u.nameKey), 'good'); sfxClick(); renderPanel('units');
            });
          });
        }
        document.getElementById('btn-attack')?.addEventListener('click', () => { sfxClick(); attackAI(); });
      } else if (tab === 'politics') {
        let html = '<div class="panel-title">' + t('pol_title') + '</div>';
        html += '<div style="margin-bottom:8px;font-size:10px;color:#789;">' + t('pp_available') + '<b style="color:#ff44ff">' + Math.floor(state.politicalPoints) + '</b> / ' + state.ppMax + '</div>';
        html += '<div class="pol-grid">';
        Object.keys(REGIMES).forEach(id => {
          if (id === 'anarchy') return; // anarchy is not selectable
          const r = REGIMES[id]; const isCur = state.regime === id; const canChange = !isCur && state.politicalPoints >= r.ppCost;
          const cls = isCur ? 'current' : canChange ? '' : 'unaffordable';
          const pros = r.pros[currentLang]; const cons = r.cons[currentLang];
          html += '<div class="pol-card ' + cls + '" data-regime="' + id + '" data-active-label="' + t('active') + '"><div class="pol-name">' + r.name[currentLang] + '</div><div class="pol-pros">' + pros.replace(/\n/g, '<br>') + '</div><div class="pol-cons">' + cons.replace(/\n/g, '<br>') + '</div>' + (isCur ? '' : '<div class="pp-cost">' + t('regime_cost') + r.ppCost + t('po') + '</div>') + '</div>';
        });
        html += '</div>';
        // Show anarchy info if active
        if (state.debuffEnd > Date.now() && state.debuffType === 'anarchy') {
          html += '<div class="pol-card anarchy" style="margin-top:8px;"><div class="pol-name" style="color:#ff4444;">' + REGIMES.anarchy.name[currentLang] + '</div><div class="pol-pros">' + REGIMES.anarchy.pros[currentLang].replace(/\n/g,'<br>') + '</div><div class="pol-cons">' + REGIMES.anarchy.cons[currentLang].replace(/\n/g,'<br>') + '</div></div>';
        }
        html += '<div style="margin-top:10px;font-size:9px;color:#789;line-height:1.4;">' + t('reg_change_warning') + '</div>';
        c.innerHTML = html;
        c.querySelectorAll('.pol-card[data-regime]').forEach(card => {
          card.addEventListener('click', () => {
            const id = card.dataset.regime; if (id === state.regime) return;
            const r = REGIMES[id];
            if (state.politicalPoints < r.ppCost) { addLog(t('not_enough_pp'), 'bad'); sfxError(); return; }
            state.politicalPoints -= r.ppCost; state.regime = id;
            state.debuffEnd = Date.now() + 300000; state.debuffType = 'anarchy';
            addLog(t('regime_change') + r.name[currentLang] + t('instability5'), 'warn'); sfxRegime(); renderPanel('politics');
          });
        });
      } else if (tab === 'map') {
        let html = '<div class="panel-title">' + t('map_title') + '</div><div style="font-size:10px;color:#789;line-height:1.6;">';
        html += '<div style="margin-bottom:6px;">' + t('buildings_count') + '<b style="color:#00e5ff">' + state.buildings.filter(b => b.built).length + '</b></div>';
        html += '<div style="margin-bottom:6px;">' + t('units_count') + '<b style="color:#ff8844">' + state.units.length + '</b></div>';
        html += '<div style="margin-bottom:6px;">' + t('play_time') + '<b style="color:#00e5ff">' + Math.floor(state.gameTime / 60) + t('min') + '</b></div>';
        html += '<div style="margin-bottom:6px;">' + t('current_regime') + '<b style="color:#ff44ff">' + REGIMES[state.regime].name[currentLang] + '</b></div>';
        html += '<div style="margin-bottom:10px;">' + t('ai_stats') + '<b style="color:#ff4444">' + state.ai.buildings + ' ' + (currentLang==='en'?'bldgs':'здан') + ', ' + state.ai.units + t('ai_units') + '</b></div>';
        html += '</div>';
        html += '<button id="btn-save" style="padding:8px 14px;background:rgba(0,229,255,.1);border:1px solid rgba(0,229,255,.25);color:#00e5ff;border-radius:5px;cursor:pointer;font-family:inherit;font-size:11px;margin-right:6px;">' + t('save') + '</button>';
        html += '<button id="btn-reset" style="padding:8px 14px;background:rgba(255,60,60,.1);border:1px solid rgba(255,80,80,.25);color:#ff6666;border-radius:5px;cursor:pointer;font-family:inherit;font-size:11px;">' + t('reset_btn') + '</button>';
        c.innerHTML = html;
        document.getElementById('btn-save')?.addEventListener('click', () => { sfxClick(); saveGame(); addLog(t('saved'), 'good'); });
        document.getElementById('btn-reset')?.addEventListener('click', () => { if (confirm(t('reset_confirm'))) { resetGame(); renderPanel('map'); } });
      } else if (tab === 'info') {
        let html = '<div class="panel-title">' + t('info_title') + '</div><div style="font-size:11px;color:#aacce6;line-height:1.6;">';
        html += '<p style="margin-bottom:8px;">' + t('info_year') + '</p>';
        html += '<p style="margin-bottom:8px;"><b style="color:#00e5ff">' + t('info_resources') + ':</b><br>';
        html += '• <b style="color:#ffaa44">' + t('regolith') + '</b> — ' + (currentLang==='en'?'building material, from mines':'строительный материал, из шахт') + '<br>';
        html += '• <b style="color:#7fff7f">' + t('helium') + '</b> — ' + (currentLang==='en'?'fuel for reactors, from mines':'топливо для реакторов, из шахт') + '<br>';
        html += '• <b style="color:#44aaff">' + t('energy') + '</b> — ' + (currentLang==='en'?'if consumption > production, base shuts down':'если потребление > выработки, база отключается') + '<br>';
        html += '• <b style="color:#ff66aa">' + t('population') + '</b> — ' + (currentLang==='en'?'grown in labs, needed for mines and units':'выращивается в лаб., нужен для шахт и юнитов') + '<br>';
        html += '• <b style="color:#ff44ff">' + t('polpoints') + '</b> — ' + (currentLang==='en'?'from domes, needed for reforms':'из куполов, нужны для реформ') + '<br>';
        html += '• <b style="color:#ff8844">' + t('logistics') + '</b> — ' + (currentLang==='en'?'spent on construction, regenerates over time':'тратится на стройку, восстанавливается') + '</p>';
        html += '<p style="margin-bottom:8px;"><b style="color:#00e5ff">' + t('info_regimes') + ':</b><br>';
        Object.keys(REGIMES).forEach(id => {
          if (id === 'anarchy') return;
          const r = REGIMES[id];
          html += '• <b>' + r.name[currentLang] + '</b> — ' + r.pros[currentLang].replace(/\n/g,'; ') + '<br>';
        });
        html += '• <b style="color:#ff4444">' + REGIMES.anarchy.name[currentLang] + '</b> — ' + (currentLang==='en'?'penalty on regime change':'штраф при смене строя') + '</p>';
        html += '<p style="margin-bottom:8px;"><b style="color:#00e5ff">' + t('info_units_h') + ':</b><br>';
        Object.keys(UNITS).forEach(id => { const u = UNITS[id]; html += '• <b>' + u.icon + ' ' + t(u.nameKey) + '</b> — ' + t(u.descKey) + '<br>'; });
        html += '</p>';
        html += '<p style="font-size:9px;color:#456;margin-top:10px;">' + t('info_offline') + '</p></div>';
        c.innerHTML = html;
      } else if (tab === 'settings') {
        let html = '<div class="panel-title">' + t('settings_title') + '</div>';
        // Language
        html += '<div class="set-row"><div><div class="set-label">' + t('language') + '</div></div>';
        html += '<div class="set-control"><button class="set-lang-btn ' + (currentLang==='ru'?'active':'') + '" data-lang="ru">RU</button><button class="set-lang-btn ' + (currentLang==='en'?'active':'') + '" data-lang="en">EN</button></div></div>';
        // Master volume
        html += '<div class="set-row"><div><div class="set-label">' + t('master_vol') + '</div><div class="set-desc">' + t('master_desc') + '</div></div>';
        html += '<div class="set-control"><input type="range" class="set-slider" id="slider-master" min="0" max="100" value="' + (settings.master*100) + '"></div></div>';
        // Music
        html += '<div class="set-row"><div><div class="set-label">' + t('music') + '</div><div class="set-desc">' + t('music_desc') + '</div></div>';
        html += '<div class="set-control"><div class="set-toggle ' + (settings.music?'on':'') + '" id="toggle-music"></div></div></div>';
        // SFX
        html += '<div class="set-row"><div><div class="set-label">' + t('sfx') + '</div><div class="set-desc">' + t('sfx_desc') + '</div></div>';
        html += '<div class="set-control"><div class="set-toggle ' + (settings.sfx?'on':'') + '" id="toggle-sfx"></div></div></div>';
        // Mute all
        html += '<div class="set-row"><div><div class="set-label">' + t('mute_all') + '</div><div class="set-desc">' + t('mute_desc') + '</div></div>';
        html += '<div class="set-control"><div class="set-toggle ' + (settings.muted?'on':'') + '" id="toggle-mute"></div></div></div>';
        c.innerHTML = html;

        // Language buttons
        c.querySelectorAll('.set-lang-btn').forEach(btn => {
          btn.addEventListener('click', () => {
            currentLang = btn.dataset.lang;
            localStorage.setItem('luna_lang', currentLang);
            applyI18n();
            sfxClick();
            renderPanel('settings');
            updateUI();
          });
        });
        // Master volume
        document.getElementById('slider-master').addEventListener('input', e => {
          settings.master = parseInt(e.target.value) / 100;
          applyAudioSettings(); saveSettings();
        });
        // Music toggle
        document.getElementById('toggle-music').addEventListener('click', () => {
          settings.music = !settings.music;
          applyAudioSettings(); saveSettings();
          if (settings.music && !settings.muted && audioCtx) startMusic();
          else if (!settings.music) stopMusic();
          renderPanel('settings');
        });
        // SFX toggle
        document.getElementById('toggle-sfx').addEventListener('click', () => {
          settings.sfx = !settings.sfx; applyAudioSettings(); saveSettings(); renderPanel('settings'); sfxClick();
        });
        // Mute toggle
        document.getElementById('toggle-mute').addEventListener('click', () => {
          settings.muted = !settings.muted;
          applyAudioSettings(); saveSettings();
          if (settings.muted) stopMusic();
          else if (settings.music && audioCtx) startMusic();
          renderPanel('settings');
        });
      }
    }

    function attackAI() {
      if (state.units.length < 3) { addLog(t('not_enough_units'), 'bad'); sfxError(); return; }
      const atkMod = getMod('attackMod') || 1;
      const myPower = state.units.reduce((s, u) => s + u.attack * atkMod, 0);
      const aiDef = state.ai.units * 8 + state.ai.buildings * 5;
      sfxCombat();
      if (myPower > aiDef * 0.8) {
        const lost = Math.floor(state.units.length * 0.3); state.units.splice(0, lost);
        const lootMod = getMod('lootMod') || 1;
        const gain = Math.floor((state.ai.regolith * 0.3 + state.ai.helium * 0.2) * lootMod);
        state.regolith += gain; state.ai.buildings = Math.max(0, state.ai.buildings - 1); state.ai.units = Math.max(0, state.ai.units - 3);
        addLog(t('victory') + gain + '. ' + (currentLang==='en'?'Units lost: ':'Потеряно юнитов: ') + lost, 'good');
      } else {
        const lost = Math.floor(state.units.length * 0.6); state.units.splice(0, lost);
        addLog(t('defeat') + lost, 'bad');
      }
      updateUI();
    }

    // =====================
    // === ГЛАВНЫЙ ЦИКЛ ====
    // =====================
    let lastTime = performance.now();
    const clock = new THREE.Clock();
    const earthRotSpeed = 0.000476;
    const moonRotSpeed = earthRotSpeed * 0.95;

    function animate() {
      requestAnimationFrame(animate);
      const now = performance.now();
      const dt = Math.min(0.1, (now - lastTime) / 1000);
      lastTime = now;
      const t2 = clock.getElapsedTime();

      gameTick(dt);
      earthAtmoMat.uniforms.uTime.value = t2;

      markers.forEach((m, i) => {
        const pulse = 1 + Math.sin(t2 * 3 + i * 0.7) * 0.2;
        if (m.userData.glow) { m.userData.glow.scale.setScalar(pulse); m.userData.glow.material.opacity = 0.15 + Math.sin(t2 * 3 + i * 0.7) * 0.1; }
      });

      const camDir = camera.position.clone().normalize();
      bgSphere.rotation.y = -camDir.x * 0.04;
      bgSphere.rotation.x = camDir.y * 0.03;
      bgSphere.rotation.z = camDir.x * 0.015;

      if (Date.now() - lastInteract > 30000) controls.autoRotate = true;
      if (controls.autoRotate) { moonGroup.rotation.y += moonRotSpeed; earthGroup.rotation.y += earthRotSpeed; }

      updateLOD();
      controls.update();
      renderer.render(scene, camera);

      if (Math.floor(t2 * 2) !== Math.floor((t2 - dt) * 2)) updateUI();
    }

    addEventListener('resize', () => {
      camera.aspect = innerWidth / innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(innerWidth, innerHeight);
      renderer.setPixelRatio(Math.min(devicePixelRatio, isMobile ? 1.5 : 2));
    });
    addEventListener('beforeunload', saveGame);

    applyI18n();
    updateUI();
    animate();
    addLog(t('game_started'), 'good');
  </script>
</body>
</html>
