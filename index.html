    const PLAYER_COUNT = 24;
    function generateTerritories(count) {
      const territories = [];
      const ga = Math.PI * (3 - Math.sqrt(5));
      for (let i = 0; i < count; i++) {
        const y = 1 - (i / (count - 1)) * 2;
        const r = Math.sqrt(1 - y * y);
        const theta = ga * i;
        const x = Math.cos(theta) * r;
        const z = Math.sin(theta) * r;
        const lat = Math.asin(y) * 180 / Math.PI;
        const lon = Math.atan2(z, x) * 180 / Math.PI;
        territories.push({ id: i, lat, lon, radius: 0 });
      }
      territories.forEach(t1 => {
        let minD = Infinity;
        territories.forEach(t2 => {
          if (t1.id === t2.id) return;
          const p1=t1.lat*Math.PI/180, p2=t2.lat*Math.PI/180;
          const dLat=(t2.lat-t1.lat)*Math.PI/180, dLon=(t2.lon-t1.lon)*Math.PI/180;
          const a=Math.sin(dLat/2)**2+Math.cos(p1)*Math.cos(p2)*Math.sin(dLon/2)**2;
          const d=2*Math.atan2(Math.sqrt(a),Math.sqrt(1-a));
          if(d<minD) minD=d;
        });
        t1.radius = minD / 2;
      });
      return territories;
    }
    const territories = generateTerritories(PLAYER_COUNT);
    function angularDistance(t1, t2) {
      const p1=t1.lat*Math.PI/180, p2=t2.lat*Math.PI/180;
      const dLat=(t2.lat-t1.lat)*Math.PI/180, dLon=(t2.lon-t1.lon)*Math.PI/180;
      const a=Math.sin(dLat/2)**2+Math.cos(p1)*Math.cos(p2)*Math.sin(dLon/2)**2;
      return 2*Math.atan2(Math.sqrt(a),Math.sqrt(1-a));
    }
    function autoPlaceBuilding(buildingId, territoryIdx) {
      const def = BUILDINGS[buildingId];
      const territory = territories[territoryIdx];
      const angle = Math.random() * Math.PI * 2;
      const distFrac = def.category === 'center' ? (0.05 + Math.random()*0.20) : (0.40 + Math.random()*0.20);
      const dist = distFrac * territory.radius;
      const cLat = territory.lat * Math.PI / 180;
      const cLon = territory.lon * Math.PI / 180;
      const newLat = cLat + dist * Math.cos(angle);
      const newLon = cLon + dist * Math.sin(angle) / Math.max(Math.cos(cLat), 0.01);
      return { lat: newLat*180/Math.PI, lon: newLon*180/Math.PI };
    }

    }
    function spendCost(cost) {
      const cm = getMod('buildCost');
      for (let k in cost) state[k] -= Math.ceil(cost[k] * cm);
    }
    // Unit_Cost_Modifier (фашизм −20%) — применяется к стоимости юнитов
    function getUnitCost(cost) {
      const cm = getMod('unitCost');
      const r = {}; for (let k in cost) r[k] = Math.ceil(cost[k] * cm); return r;
    }
    function canAffordUnit(cost) {
      const c = getUnitCost(cost);
      for (let k in c) if (state[k] === undefined || state[k] < c[k]) return false; return true;
    }
    function spendUnitCost(cost) {
      const c = getUnitCost(cost); for (let k in c) state[k] -= c[k];
    }
    function fmtNum(n) { if (n >= 1000) return (n / 1000).toFixed(1) + 'к'; return Math.floor(n).toString(); }
    function getNearestAI() {
      const myT = territories[0];
      return state.aiPlayers.filter(a => a.active).map(a => ({ ai: a, dist: angularDistance(myT, territories[a.territoryIdx]) })).sort((a, b) => a.dist - b.dist);
    }

    function updateUI() {
      document.getElementById('r-regolith').textContent = fmtNum(state.regolith);
      document.getElementById('r-helium').textContent = fmtNum(state.helium);
      let eProd = 0, eUse = 0;
      state.buildings.forEach(b => { if (!b.built) return; const d = BUILDINGS[b.id]; if (d.energyUse) eUse += d.energyUse; if (b.id === 'dome') eProd += 2; });
      eUse += state.units.length * 0.5 * getMod('unitUpkeep');
      document.getElementById('r-energy').textContent = Math.floor(state.energy) + '/' + state.energyMax;
      document.getElementById('r-energy').parentElement.classList.toggle('low', state.energy < eUse);
      document.getElementById('r-pop').textContent = Math.floor(state.pop) + '/' + state.popMax;
      document.getElementById('r-pp').textContent = Math.floor(state.politicalPoints);
      document.getElementById('r-logistics').textContent = Math.floor(state.logistics) + '/' + state.logisticsMax;
      const db = document.getElementById('debuff-bar');
      if (state.debuffEnd > Date.now()) { db.textContent = t('instability') + Math.ceil((state.debuffEnd - Date.now()) / 60000) + t('min'); db.classList.add('show'); } else db.classList.remove('show');
      const nearest = getNearestAI().slice(0, 3);
      const info = nearest.map(n => 'AI-' + n.ai.id + ': ' + n.ai.buildings + (currentLang==='en'?'b':'з') + '/' + n.ai.units + (currentLang==='en'?'u':'в')).join(' | ');
      document.getElementById('ai-panel-info').textContent = info || (currentLang==='en'?'No threats':'Нет угроз');
    }

    let activeTab = null;
    document.querySelectorAll('.tab-btn').forEach(btn => {
      btn.addEventListener('click', () => {
        sfxClick();
        const tab = btn.dataset.tab;
        if (activeTab === tab) { document.getElementById('panel').classList.remove('show'); btn.classList.remove('active'); activeTab = null; return; }
        document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
        btn.classList.add('active'); activeTab = tab; document.getElementById('panel').classList.add('show'); renderPanel(tab);
      });
    });
    const settingsBtn = document.getElementById('btn-settings');
    settingsBtn.addEventListener('click', () => {
      sfxClick();
      if (activeTab === 'settings') { document.getElementById('panel').classList.remove('show'); settingsBtn.classList.remove('active'); activeTab = null; return; }
      document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
      settingsBtn.classList.add('active'); activeTab = 'settings'; document.getElementById('panel').classList.add('show'); renderPanel('settings');
    });

    function renderPanel(tab) {
      const c = document.getElementById('panel-content');
      if (tab === 'build') {
        let html = '<div class="panel-title">' + t('build_title') + '</div><div class="build-grid">';
        Object.keys(BUILDINGS).forEach(id => {
          const b = BUILDINGS[id]; const aff = canAfford(b.cost); const inQueue = state.buildQueue.some(q => q.id === id);
          const zoneLabel = b.category === 'center' ? t('zone_center') : t('zone_outer');
          let costHtml = ''; const ck = { regolith:'r', helium:'h', energy:'e' };
          const cm = getMod('buildCost');
          for (let k in b.cost) { costHtml += '<span class="cost-' + ck[k] + '">' + Math.ceil(b.cost[k] * cm) + ' ' + t(k + '_short') + '</span>'; }
          html += '<div class="build-card ' + (aff?'affordable':'unaffordable') + (inQueue?' building':'') + '" data-build="' + id + '"><div class="build-name">' + b.icon + ' ' + t(b.nameKey) + '</div><div class="build-desc">' + t(b.descKey) + '</div><div class="build-cost">' + costHtml + ' <span class="cost-l">⏱' + Math.ceil(b.buildTime/1000) + t('time_short') + '</span></div><div class="build-zone">' + zoneLabel + '</div>' + (inQueue?'<div class="build-timer"><div class="build-timer-fill" style="width:50%"></div></div>':'') + '</div>';
        });
        html += '</div>';
        c.innerHTML = html;
        c.querySelectorAll('.build-card').forEach(card => {
          card.addEventListener('click', () => {
            const id = card.dataset.build; const b = BUILDINGS[id];
            if (!canAfford(b.cost)) { addLog(t('not_enough_res'), 'bad'); sfxError(); return; }
            if (state.buildQueue.some(q => q.id === id)) { addLog(t('already_building'), 'warn'); return; }
            if (state.logistics < 1) { addLog(t('not_enough_log'), 'bad'); sfxError(); return; }
            spendCost(b.cost); state.logistics--;
            const speedMod = getMod('buildSpeed');
            state.buildQueue.push({ id, remaining: b.buildTime / speedMod, built: false });
            addLog(t('started_build') + t(b.nameKey), 'good'); sfxBuild(); renderPanel('build');
          });
        });
      } else if (tab === 'units') {
        const locked = isUnitLocked();
        let html = '<div class="panel-title">' + t('unit_title') + '</div>';
        if (locked) html += '<div style="margin-bottom:8px;font-size:10px;color:#ff4444;">' + t('units_locked') + '</div>';
        html += '<div style="margin-bottom:8px;font-size:10px;color:#789;">' + t('your_units') + ': ' + state.units.length + '</div>';
        html += '<div class="unit-grid">';
        Object.keys(UNITS).forEach(id => {
          const u = UNITS[id]; const aff = canAffordUnit(u.cost);
          const cls = locked ? 'locked' : (aff ? 'affordable' : 'unaffordable');
          let costHtml = ''; const ck = { regolith:'r', helium:'h', energy:'e' };
          const uc = getUnitCost(u.cost);
          for (let k in uc) costHtml += '<span class="cost-' + ck[k] + '">' + uc[k] + ' ' + t(k + '_short') + '</span>';
          html += '<div class="unit-card ' + cls + '" data-unit="' + id + '"><div class="unit-name">' + u.icon + ' ' + t(u.nameKey) + '</div><div class="unit-desc">' + t(u.descKey) + '</div><div class="unit-stats"><div class="unit-stat"><span class="val">' + u.attack + '</span>' + t('attack') + '</div><div class="unit-stat"><span class="val">' + u.defense + '</span>' + t('defense') + '</div></div><div class="build-cost">' + costHtml + ' <span class="cost-p">👥' + u.popNeed + '</span></div></div>';
        });
        html += '</div>';
        html += '<div style="margin-top:10px;font-size:9px;color:#789;line-height:1.4;"><b style="color:#ff6644">' + (currentLang==='en'?'Attack:':'Атака:') + '</b><br><button id="btn-attack" style="margin-top:6px;padding:6px 12px;background:rgba(255,60,60,.15);border:1px solid rgba(255,80,80,.3);color:#ff8866;border-radius:5px;cursor:pointer;font-family:inherit;font-size:11px;">' + t('attack_ai') + '</button></div>';
        c.innerHTML = html;
        if (!locked) {
          c.querySelectorAll('.unit-card').forEach(card => {
            card.addEventListener('click', () => {
              const id = card.dataset.unit; const u = UNITS[id];
              if (!canAffordUnit(u.cost)) { addLog(t('not_enough_res'), 'bad'); sfxError(); return; }
              const popUsed = state.units.reduce((s, un) => s + (UNITS[un.id]?.popNeed || 0), 0);
              if (state.pop < u.popNeed + popUsed) { addLog(t('not_enough_pop'), 'bad'); sfxError(); return; }
              spendUnitCost(u.cost);
              const speedMod = getMod('buildSpeed');
              setTimeout(() => { state.units.push({ id, hp: u.defense * 2, attack: u.attack, defense: u.defense }); addLog(t('unit_ready') + t(u.nameKey), 'good'); sfxBuild(); updateUI(); }, u.buildTime / speedMod);
              addLog(t('started_training') + t(u.nameKey), 'good'); sfxClick(); renderPanel('units');
            });
          });
        }
        document.getElementById('btn-attack')?.addEventListener('click', () => { sfxClick(); attackNearestAI(); });
      } else if (tab === 'politics') {
        let html = '<div class="panel-title">' + t('pol_title') + '</div>';
        html += '<div style="margin-bottom:8px;font-size:10px;color:#789;">' + t('pp_available') + '<b style="color:#ff44ff">' + Math.floor(state.politicalPoints) + '</b> / ' + state.ppMax + '</div>';
        html += '<div class="pol-grid">';
        Object.keys(REGIMES).forEach(id => {
          if (id === 'anarchy') return;
          const r = REGIMES[id]; const isCur = state.regime === id; const canChange = !isCur && state.politicalPoints >= r.ppCost;
          const cls = isCur ? 'current' : canChange ? '' : 'unaffordable';
          html += '<div class="pol-card ' + cls + '" data-regime="' + id + '" data-active-label="' + t('active') + '"><div class="pol-name">' + r.name[currentLang] + '</div><div style="font-size:8px;color:#888;margin-bottom:4px;">' + r.subtitle[currentLang] + '</div><div class="pol-pros">' + r.pros[currentLang].replace(/\n/g,'<br>') + '</div><div class="pol-cons">' + r.cons[currentLang].replace(/\n/g,'<br>') + '</div>' + (isCur ? '' : '<div class="pp-cost">' + t('regime_cost') + r.ppCost + t('po') + '</div>') + '</div>';
        });
        html += '</div>';
        if (state.debuffEnd > Date.now() && state.debuffType === 'anarchy') {
          html += '<div class="pol-card anarchy" style="margin-top:8px;"><div class="pol-name" style="color:#ff4444;">' + REGIMES.anarchy.name[currentLang] + '</div><div style="font-size:8px;color:#888;margin-bottom:4px;">' + REGIMES.anarchy.subtitle[currentLang] + '</div><div class="pol-pros">' + REGIMES.anarchy.pros[currentLang].replace(/\n/g,'<br>') + '</div><div class="pol-cons">' + REGIMES.anarchy.cons[currentLang].replace(/\n/g,'<br>') + '</div></div>';
        }
        html += '<div style="margin-top:10px;font-size:9px;color:#789;line-height:1.4;">' + t('reg_change_warning') + '</div>';
        c.innerHTML = html;
        c.querySelectorAll('.pol-card[data-regime]').forEach(card => {
          card.addEventListener('click', () => {
            const id = card.dataset.regime; if (id === state.regime) return;
            const r = REGIMES[id];
            if (state.politicalPoints < r.ppCost) { addLog(t('not_enough_pp'), 'bad'); sfxError(); return; }
            state.politicalPoints -= r.ppCost; state.regime = id;
            state.debuffEnd = Date.now() + 300000; state.debuffType = 'anarchy';
            addLog(t('regime_change') + r.name[currentLang] + t('instability5'), 'warn'); sfxRegime(); renderPanel('politics');
          });
        });
      } else if (tab === 'map') {
        let html = '<div class="panel-title">' + t('map_title') + '</div><div style="font-size:10px;color:#789;line-height:1.6;">';
        html += '<div style="margin-bottom:6px;">' + t('buildings_count') + '<b style="color:#00e5ff">' + state.buildings.filter(b=>b.built).length + '</b></div>';
        html += '<div style="margin-bottom:6px;">' + t('units_count') + '<b style="color:#ff8844">' + state.units.length + '</b></div>';
        html += '<div style="margin-bottom:6px;">' + t('play_time') + '<b style="color:#00e5ff">' + Math.floor(state.gameTime/60) + t('min') + '</b></div>';
        html += '<div style="margin-bottom:6px;">' + t('current_regime') + '<b style="color:#ff44ff">' + REGIMES[state.regime].name[currentLang] + '</b></div>';
        html += '<div style="margin-bottom:10px;">' + t('total_players') + '</div>';
        html += '</div>';
        const nearest = getNearestAI().slice(0, 8);
        html += '<div style="font-size:10px;color:#ff6644;font-weight:600;margin-bottom:4px;">' + t('nearest_ai') + '</div>';
        html += '<div class="ai-list">';
        if (nearest.length === 0) { html += '<div class="ai-row">' + t('no_ai_near') + '</div>'; }
        else {
          nearest.forEach(n => {
            const distDeg = (n.dist * 180 / Math.PI).toFixed(1);
            html += '<div class="ai-row' + (n.dist < territories[0].radius * 1.5 ? ' near' : '') + '"><span class="ai-row-name">AI-' + n.ai.id + ' (' + REGIMES[n.ai.regime].name[currentLang] + ')</span><span class="ai-row-stats">' + n.ai.buildings + (currentLang==='en'?'b':'з') + ' / ' + n.ai.units + (currentLang==='en'?'u':'в') + ' / ' + distDeg + '°</span></div>';
          });
        }
        html += '</div>';
        html += '<div style="margin-top:10px;"><button id="btn-save" style="padding:8px 14px;background:rgba(0,229,255,.1);border:1px solid rgba(0,229,255,.25);color:#00e5ff;border-radius:5px;cursor:pointer;font-family:inherit;font-size:11px;margin-right:6px;">' + t('save') + '</button>';
        html += '<button id="btn-reset" style="padding:8px 14px;background:rgba(255,60,60,.1);border:1px solid rgba(255,80,80,.25);color:#ff6666;border-radius:5px;cursor:pointer;font-family:inherit;font-size:11px;">' + t('reset_btn') + '</button></div>';
        c.innerHTML = html;
        document.getElementById('btn-save')?.addEventListener('click', () => { sfxClick(); saveGame(); addLog(t('saved'), 'good'); });
        document.getElementById('btn-reset')?.addEventListener('click', () => { if (confirm(t('reset_confirm'))) { resetGame(); renderPanel('map'); } });
      } else if (tab === 'info') {
        let html = '<div class="panel-title">' + t('info_title') + '</div><div style="font-size:11px;color:#aacce6;line-height:1.6;">';
        html += '<p style="margin-bottom:8px;">' + t('info_year') + '</p>';
        html += '<p style="margin-bottom:8px;"><b style="color:#00e5ff">' + t('info_territories') + ':</b> ' + t('info_territory_desc') + '</p>';
        html += '<p style="margin-bottom:8px;"><b style="color:#00e5ff">' + t('info_regimes') + ':</b><br>';
        Object.keys(REGIMES).forEach(id => {
          if (id === 'anarchy') return;
          const r = REGIMES[id];
          html += '• <b>' + r.name[currentLang] + '</b> <i style="color:#666;font-size:9px">(' + r.subtitle[currentLang] + ')</i> — ' + r.pros[currentLang].replace(/\n/g,'; ') + '<br>';
        });
        html += '• <b style="color:#ff4444">' + REGIMES.anarchy.name[currentLang] + '</b> <i style="color:#666;font-size:9px">(' + REGIMES.anarchy.subtitle[currentLang] + ')</i></p>';
        html += '<p style="margin-bottom:8px;"><b style="color:#00e5ff">' + t('info_units_h') + ':</b><br>';
        Object.keys(UNITS).forEach(id => { const u = UNITS[id]; html += '• <b>' + u.icon + ' ' + t(u.nameKey) + '</b> — ' + t(u.descKey) + '<br>'; });
        html += '</p>';
        html += '<p style="font-size:9px;color:#456;margin-top:10px;">' + t('info_offline') + '</p></div>';
        c.innerHTML = html;
      } else if (tab === 'settings') {
        let html = '<div class="panel-title">' + t('settings_title') + '</div>';
        html += '<div class="set-row"><div><div class="set-label">' + t('language') + '</div></div><div class="set-control"><button class="set-lang-btn ' + (currentLang==='ru'?'active':'') + '" data-lang="ru">RU</button><button class="set-lang-btn ' + (currentLang==='en'?'active':'') + '" data-lang="en">EN</button></div></div>';
        html += '<div class="set-row"><div><div class="set-label">' + t('master_vol') + '</div><div class="set-desc">' + t('master_desc') + '</div></div><div class="set-control"><input type="range" class="set-slider" id="slider-master" min="0" max="100" value="' + (settings.master*100) + '"></div></div>';
        html += '<div class="set-row"><div><div class="set-label">' + t('music') + '</div><div class="set-desc">' + t('music_desc') + '</div></div><div class="set-control"><div class="set-toggle ' + (settings.music?'on':'') + '" id="toggle-music"></div></div></div>';
        html += '<div class="set-row"><div><div class="set-label">' + t('sfx') + '</div><div class="set-desc">' + t('sfx_desc') + '</div></div><div class="set-control"><div class="set-toggle ' + (settings.sfx?'on':'') + '" id="toggle-sfx"></div></div></div>';
        html += '<div class="set-row"><div><div class="set-label">' + t('mute_all') + '</div><div class="set-desc">' + t('mute_desc') + '</div></div><div class="set-control"><div class="set-toggle ' + (settings.muted?'on':'') + '" id="toggle-mute"></div></div></div>';
        c.innerHTML = html;
        c.querySelectorAll('.set-lang-btn').forEach(btn => { btn.addEventListener('click', () => { currentLang = btn.dataset.lang; localStorage.setItem('luna_lang', currentLang); applyI18n(); sfxClick(); renderPanel('settings'); updateUI(); rebuildMarkers(); }); });
        document.getElementById('slider-master').addEventListener('input', e => { settings.master = parseInt(e.target.value) / 100; applyAudioSettings(); saveSettings(); });
        document.getElementById('toggle-music').addEventListener('click', () => { settings.music = !settings.music; applyAudioSettings(); saveSettings(); if (settings.music && !settings.muted && audioCtx) startMusic(); else if (!settings.music) stopMusic(); renderPanel('settings'); });
        document.getElementById('toggle-sfx').addEventListener('click', () => { settings.sfx = !settings.sfx; applyAudioSettings(); saveSettings(); renderPanel('settings'); sfxClick(); });
        document.getElementById('toggle-mute').addEventListener('click', () => { settings.muted = !settings.muted; applyAudioSettings(); saveSettings(); if (settings.muted) stopMusic(); else if (settings.music && audioCtx) startMusic(); renderPanel('settings'); });
      }
    }

    // === АТАКА — Attack_Modifier и Defense_Modifier и Loot_Capacity_Modifier ===
    function attackNearestAI() {
      if (state.units.length < 3) { addLog(t('not_enough_units'), 'bad'); sfxError(); return; }
      const nearest = getNearestAI()[0];
      if (!nearest) { addLog(t('no_ai_near'), 'bad'); return; }
      const ai = nearest.ai;
      // Attack_Modifier (фашизм +20%, демократия −15%)
      const atkMod = getMod('attackMod');
      const myPower = state.units.reduce((s, u) => s + u.attack * atkMod, 0);
      const aiDef = ai.units * 8 + ai.buildings * 5;
      sfxCombat();
      if (myPower > aiDef * 0.8) {
        const lost = Math.floor(state.units.length * 0.3); state.units.splice(0, lost);
        // Loot_Capacity_Modifier (фашизм +30%)
        const lootMod = getMod('lootMod');
        const gain = Math.floor((ai.regolith * 0.3 + ai.helium * 0.2) * lootMod);
        state.regolith += gain; ai.buildings = Math.max(0, ai.buildings - 1); ai.units = Math.max(0, ai.units - 3);
        addLog(t('victory') + gain + '. ' + (currentLang==='en'?'Units lost: ':'Потеряно: ') + lost, 'good');
        rebuildMarkers();
      } else {
        const lost = Math.floor(state.units.length * 0.6); state.units.splice(0, lost);
        addLog(t('defeat') + lost, 'bad');
      }
      updateUI();
    }

    // === ГЛАВНЫЙ ЦИКЛ ===
    let lastTime = performance.now();
    const clock = new THREE.Clock();
    const earthRotSpeed = 0.000476, moonRotSpeed = earthRotSpeed * 0.95;
    function animate() {
      requestAnimationFrame(animate);
      const now = performance.now();
      const dt = Math.min(0.1, (now - lastTime) / 1000);
      lastTime = now;
      const t2 = clock.getElapsedTime();
      gameTick(dt);
      earthAtmoMat.uniforms.uTime.value = t2;
      markers.forEach((m, i) => { const pulse = 1 + Math.sin(t2 * 3 + i * 0.7) * 0.2; if (m.userData.glow) { m.userData.glow.scale.setScalar(pulse); m.userData.glow.material.opacity = 0.15 + Math.sin(t2 * 3 + i * 0.7) * 0.1; } });
      const camDir = camera.position.clone().normalize();
      bgSphere.rotation.y = -camDir.x * 0.04; bgSphere.rotation.x = camDir.y * 0.03; bgSphere.rotation.z = camDir.x * 0.015;
      if (Date.now() - lastInteract > 30000) controls.autoRotate = true;
      if (controls.autoRotate) { moonGroup.rotation.y += moonRotSpeed; earthGroup.rotation.y += earthRotSpeed; }
      updateLOD();
      controls.update();
      renderer.render(scene, camera);
      if (Math.floor(t2 * 2) !== Math.floor((t2 - dt) * 2)) updateUI();
    }

    addEventListener('resize', () => { camera.aspect = innerWidth / innerHeight; camera.updateProjectionMatrix(); renderer.setSize(innerWidth, innerHeight); renderer.setPixelRatio(Math.min(devicePixelRatio, isMobile ? 1.5 : 2)); });
    addEventListener('beforeunload', saveGame);

    applyI18n();
    rebuildMarkers();
    updateUI();
    animate();
    addLog(t('game_started'), 'good');
  </script>
</body>
</html>
