function closeAttackModal(){attackModal.classList.remove('show')}
function renderAttackList(filter){let known=getKnownAI();let nr=getNearestAI();let h='';if(filter===''){if(attackTab==='recon'){h+='<div class="attack-item attack-item-nearest" data-ai-id="-1"><div><div class="attack-item-name">'+t('recon_surface')+'</div><div class="attack-item-info">'+t('recon_surface_desc')+'</div></div><div class="attack-item-info">10 '+(currentLang==='en'?'spies':'шп')+'</div></div>'}else{let nearest=nr[0];if(nearest){let dd=(nearest.dist*180/Math.PI).toFixed(1);h+='<div class="attack-item attack-item-nearest" data-ai-id="'+nearest.ai.id+'"><div><div class="attack-item-name">'+t('attack_nearest')+'</div><div class="attack-item-info">'+nearest.ai.name+' — '+dd+'°</div></div><div class="attack-item-info">'+nearest.ai.buildings+(currentLang==='en'?'b':'з')+' / '+nearest.ai.units+(currentLang==='en'?'u':'в')+'</div></div>'}}}let filtered=filter===''?known:known.filter(a=>a.name.toLowerCase().includes(filter.toLowerCase()));filtered.sort((a,b)=>{let da=angularDistance(territories[0],territories[a.territoryIdx]),db=angularDistance(territories[0],territories[b.territoryIdx]);return da-db});filtered.forEach(ai=>{let dist=angularDistance(territories[0],territories[ai.territoryIdx]);let dd=(dist*180/Math.PI).toFixed(1);h+='<div class="attack-item" data-ai-id="'+ai.id+'"><div><div class="attack-item-name">'+ai.name+'</div><div class="attack-item-info">'+REGIMES[ai.regime].name[currentLang]+' — '+dd+'°</div></div><div class="attack-item-info">'+ai.buildings+(currentLang==='en'?'b':'з')+' / '+ai.units+(currentLang==='en'?'u':'в')+'</div></div>'});if(filtered.length===0&&filter!==''){h+='<div style="padding:12px;text-align:center;color:#666;font-size:14px;">'+t('no_colonies')+'</div>'}attackList.innerHTML=h;attackList.querySelectorAll('.attack-item').forEach(item=>{item.addEventListener('click',()=>{let aiId=parseInt(item.dataset.aiId);closeAttackModal();if(attackTab==='recon'){if(aiId===-1)sendSurfaceRecon();else sendSpies(aiId)}else attackAI(aiId)})})}
attackSearch.addEventListener('input',()=>{renderAttackList(attackSearch.value)});document.getElementById('attack-tab-attack').addEventListener('click',()=>{sfxClick();attackTab='attack';document.getElementById('attack-tab-attack').classList.add('active');document.getElementById('attack-tab-recon').classList.remove('active');renderAttackList(attackSearch.value)});document.getElementById('attack-tab-recon').addEventListener('click',()=>{sfxClick();attackTab='recon';document.getElementById('attack-tab-recon').classList.add('active');document.getElementById('attack-tab-attack').classList.remove('active');renderAttackList(attackSearch.value)});
document.getElementById('attack-close').addEventListener('click',()=>{closeAttackModal()});
document.getElementById('btn-attack-float').addEventListener('click',()=>{sfxClick();openAttackModal()});
document.getElementById('end-newgame').addEventListener('click',()=>{sfxClick();resetGame()});
attackModal.addEventListener('click',e=>{if(e.target===attackModal)closeAttackModal()});
function damagePlayerBuildings(dmg){let built=state.buildings.filter(b=>b.built),rem=dmg,destroyed=0;built.sort((a,b)=>(b.hp||0)-(a.hp||0));for(let i=0;i<built.length&&rem>0;i++){let b=built[i];if(b.hp===undefined)b.hp=BLDG_HP[b.id]||100;let dmgTo=Math.min(b.hp,rem);b.hp-=dmgTo;rem-=dmgTo;if(b.hp<=0){b.built=false;destroyed++}}if(destroyed>0)rebuildMarkers();return destroyed}
let endShown=false;
function showEnd(type){endShown=true;let m=document.getElementById('end-modal'),ti=document.getElementById('end-title'),de=document.getElementById('end-desc');ti.textContent=t(type==='win'?'victory_title':'defeat_title');de.textContent=t(type==='win'?'victory_text':'defeat_text');m.classList.add('show')}
function checkEnd(){if(endShown)return false;if(state.aiPlayers.filter(a=>a.active).length===0){showEnd('win');return true}if(!state.buildings.some(b=>b.built)){showEnd('lose');return true}return false}
function sendSurfaceRecon(){if(!state.buildings.some(b=>b.built&&b.id==='recon')){addLog(t('need_recon'),'bad');sfxError();return}let spies=state.units.filter(u=>u.type==='spy');if(spies.length<10){addLog(t('need_spies'),'bad');sfxError();return}let unknown=state.aiPlayers.filter(a=>a.active&&!a.known);if(unknown.length===0){addLog(t('no_colonies'),'bad');return}let target=unknown[Math.floor(Math.random()*unknown.length)];let removed=0;for(let i=state.units.length-1;i>=0&&removed<10;i--){if(state.units[i].type==='spy'){state.units.splice(i,1);removed++}}let others=state.aiPlayers.filter(a=>a.active&&a.id!==target.id);for(let i=others.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));let tmp=others[i];others[i]=others[j];others[j]=tmp}let stops=others.slice(0,Math.floor(Math.random()*4));stops.push(target);let survived=10;stops.forEach(st=>{let p=Math.min(0.5,0.2+st.buildings*0.015);let keep=0;for(let s=0;s<survived;s++){if(Math.random()>=p)keep++}survived=keep});target.known=true;if(!state.reconLog)state.reconLog=[];state.reconLog.push({target:target.name,returned:survived,intel:survived>0?(target.buildings+'з/'+target.units+'в'):null});addLog(t('recon_discovered')+target.name,'good');sfxClick();rebuildMarkers();if(survived>0){state.politicalPoints=Math.min(state.ppMax,state.politicalPoints+survived*3);addLog(t('recon_result')+survived+t('recon_of')+'10','good')}else{addLog(t('recon_result')+'0'+t('recon_of')+'10','bad')}updateUI()}
function sendSpies(aiId){let ai=state.aiPlayers.find(a=>a.id===aiId);if(!ai||!ai.active){return}if(!state.buildings.some(b=>b.built&&b.id==='recon')){addLog(t('need_recon'),'bad');sfxError();return}let spies=state.units.filter(u=>u.type==='spy');if(spies.length<10){addLog(t('need_spies'),'bad');sfxError();return}let removed=0;for(let i=state.units.length-1;i>=0&&removed<10;i--){if(state.units[i].type==='spy'){state.units.splice(i,1);removed++}}let others=state.aiPlayers.filter(a=>a.active&&a.id!==aiId);for(let i=others.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));let tmp=others[i];others[i]=others[j];others[j]=tmp}let stops=others.slice(0,Math.floor(Math.random()*4));stops.push(ai);let survived=10,names=[];stops.forEach(st=>{names.push(st.name);let p=Math.min(0.5,0.2+st.buildings*0.015);let keep=0;for(let s=0;s<survived;s++){if(Math.random()>=p)keep++}survived=keep});addLog(t('recon_sent')+names.join(' → '),'info');sfxClick();if(survived>0){state.politicalPoints=Math.min(state.ppMax,state.politicalPoints+survived*3);ai.known=true;if(!state.reconLog)state.reconLog=[];state.reconLog.push({target:ai.name,returned:survived,intel:ai.buildings+'з/'+ai.units+'в'});addLog(t('recon_result')+survived+t('recon_of')+'10. '+t('recon_intel')+ai.name+' ('+ai.buildings+'з / '+ai.units+'в)','good')}else{addLog(t('recon_result')+'0'+t('recon_of')+'10','bad')}updateUI()}
function attackAI(aiId){let ai=state.aiPlayers.find(a=>a.id===aiId);if(!ai||!ai.active){return}if(state.units.length<3){addLog(t('not_enough_units'),'bad');sfxError();return}let am=getMod('attackMod'),myPow=state.units.reduce((s,u)=>s+u.attack*am,0),aiDef=ai.units*8+ai.buildings*5;sfxCombat();if(myPow>aiDef*.8){let lost=Math.floor(state.units.length*.3);state.units.splice(0,lost);let lm=getMod('lootMod'),regGain=Math.floor((ai.regolith*.3)*lm),helGain=Math.floor((ai.helium*.2)*lm);state.regolith+=regGain;state.helium+=helGain;ai.regolith=Math.max(0,ai.regolith-ai.regolith*.3);ai.helium=Math.max(0,ai.helium-ai.helium*.2);if(ai.buildingHp===undefined)ai.buildingHp=ai.buildings*250;ai.buildingHp=Math.max(0,ai.buildingHp-myPow);ai.buildings=Math.max(0,Math.min(ai.buildings,Math.ceil(ai.buildingHp/250)));ai.units=Math.max(0,ai.units-3);addLog(t('victory')+t('loot_reg')+regGain+', '+t('loot_hel')+helGain+'. '+t('units_lost')+lost,'good');if(ai.buildingHp<=0||ai.buildings<=0){ai.buildings=0;ai.units=0;ai.active=false;addLog(t('colony_destroyed')+ai.name,'good');rebuildMarkers();checkEnd()}else{rebuildMarkers()}}else{let lost=Math.floor(state.units.length*.6);state.units.splice(0,lost);addLog(t('defeat')+lost,'bad')}updateUI()}
function attackNearestAI(){let nr=getNearestAI()[0];if(!nr){addLog(t('no_ai_near'),'bad');return}attackAI(nr.ai.id)}
let lastTime=performance.now(),clock=new THREE.Clock();const earthRotSpeed=476e-6,moonRotSpeed=earthRotSpeed*.95;const earthOrbitSpeed=.02,sunOrbitSpeed=.008,_sunV=new THREE.Vector3(),_earthV=new THREE.Vector3(),_zeroV=new THREE.Vector3();
function animate(){requestAnimationFrame(animate);let now=performance.now(),dt=Math.min(.1,(now-lastTime)/1e3);lastTime=now;let t2=clock.getElapsedTime();gameTick(dt);rotStep(dt);earthAtmoMat.uniforms.uTime.value=t2;earthOrbit.rotation.y+=earthOrbitSpeed*dt;sunOrbit.rotation.y+=sunOrbitSpeed*dt;sunGroup.getWorldPosition(_sunV);sunLight.position.copy(_sunV);earthGroup.getWorldPosition(_earthV);earthMat.uniforms.uLightDir.value.copy(_sunV).sub(_earthV).normalize();earthMat.uniforms.uMoonDir.value.subVectors(_zeroV,_earthV).normalize();eShine.position.copy(_earthV);if(zoomTargetDist!==null){let curDist=camera.position.length();let newDist=curDist+(zoomTargetDist-curDist)*.12;if(Math.abs(zoomTargetDist-newDist)<.02){camera.position.normalize().multiplyScalar(zoomTargetDist);zoomTargetDist=null}else{camera.position.normalize().multiplyScalar(newDist)}controls.update()}markers.forEach((m,i)=>{let p=1+Math.sin(t2*3+i*.7)*.2;if(m.userData.glow){m.userData.glow.scale.setScalar(p);m.userData.glow.material.opacity=.15+Math.sin(t2*3+i*.7)*.1}});let cd=camera.position.clone().normalize();bgSphere.rotation.y=-cd.x*.04;bgSphere.rotation.x=cd.y*.03;bgSphere.rotation.z=cd.x*.015;if(Date.now()-lastInteract>3e4)controls.autoRotate=true;if(controls.autoRotate){moonGroup.rotation.y+=moonRotSpeed*rotFactor;earthGroup.rotation.y+=earthRotSpeed*rotFactor}updateLOD();controls.update();renderer.render(scene,camera);if(Math.floor(t2*2)!==Math.floor((t2-dt)*2))updateUI()}
addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight);renderer.setPixelRatio(Math.min(devicePixelRatio,isMobile?1.5:2));applyI18n()});addEventListener('beforeunload',saveGame);
applyI18n();rebuildMarkers();updateUI();animate();addLog(t('game_started'),'good');
</script>
