function generateTerritories(n){let t=[],ga=Math.PI*(3-Math.sqrt(5));for(let i=0;i<n;i++){let y=1-(i/(n-1))*2,r=Math.sqrt(1-y*y),th=ga*i,x=Math.cos(th)*r,z=Math.sin(th)*r;t.push({id:i,lat:Math.asin(y)*180/Math.PI,lon:Math.atan2(z,x)*180/Math.PI,radius:0})}t.forEach(t1=>{let mD=Infinity;t.forEach(t2=>{if(t1.id===t2.id)return;let p1=t1.lat*Math.PI/180,p2=t2.lat*Math.PI/180,dLat=(t2.lat-t1.lat)*Math.PI/180,dLon=(t2.lon-t1.lon)*Math.PI/180,a=Math.sin(dLat/2)**2+Math.cos(p1)*Math.cos(p2)*Math.sin(dLon/2)**2,d=2*Math.atan2(Math.sqrt(a),Math.sqrt(1-a));if(d<mD)mD=d});t1.radius=mD/2});return t}

else if(tab==='units'){let locked=isUnitLocked(),h='<div class="panel-title">'+t('unit_title')+'</div>';if(locked)h+='<div style="margin-bottom:8px;font-size:13px;color:#ff4444;">'+t('units_locked')+'</div>';h+='<div style="margin-bottom:8px;font-size:13px;color:#789;">'+t('your_units')+': '+state.units.length+'</div><div class="unit-grid">';Object.keys(UNITS).forEach(id=>{let u=UNITS[id],aff=canAffordUnit(u.cost),cls=locked?'locked':(aff?'affordable':'unaffordable'),ch='',ck={regolith:'r',helium:'h',energy:'e'},uc=getUnitCost(u.cost);for(let k in uc)ch+='<span class="cost-'+ck[k]+'">'+uc[k]+' '+t(k+'_short')+'</span>';h+='<div class="unit-card '+cls+'" data-unit="'+id+'"><div class="unit-name">'+u.icon+' '+t(u.nameKey)+'</div><div class="unit-desc">'+t(u.descKey)+'</div><div class="unit-stats"><div class="unit-stat"><span class="val">'+u.attack+'</span>'+t('attack')+'</div><div class="unit-stat"><span class="val">'+u.defense+'</span>'+t('defense')+'</div></div><div class="build-cost">'+ch+' <span class="cost-p">👥'+u.popNeed+'</span></div></div>'});h+='</div>';h+='<div style="margin-top:12px;font-size:13px;color:#789;line-height:1.4;"><b style="color:#ff6644">'+(currentLang==='en'?'Attack:':'Атака:')+'</b><br><button id="btn-attack" style="margin-top:8px;padding:8px 16px;background:rgba(255,60,60,.15);border:1px solid rgba(255,80,80,.3);color:#ff8866;border-radius:5px;cursor:pointer;font-family:inherit;font-size:14px;">'+t('attack_ai')+'</button></div>';c.innerHTML=h;if(!locked){c.querySelectorAll('.unit-card').forEach(card=>{card.addEventListener('click',()=>{let id=card.dataset.unit,u=UNITS[id];if(!canAffordUnit(u.cost)){addLog(t('not_enough_res'),'bad');sfxError();return}let popUsed=state.units.reduce((s,un)=>s+(UNITS[un.id]?.popNeed||0),0);if(state.pop<u.popNeed+popUsed){addLog(t('not_enough_pop'),'bad');sfxError();return}spendUnitCost(u.cost);let sm=getMod('buildSpeed');setTimeout(()=>{state.units.push({id,hp:u.defense*2,attack:u.attack,defense:u.defense});addLog(t('unit_ready')+t(u.nameKey),'good');sfxBuild();updateUI()},u.buildTime/sm);addLog(t('started_training')+t(u.nameKey),'good');sfxClick();renderPanel('units')})})}document.getElementById('btn-attack')?.addEventListener('click',()=>{sfxClick();attackNearestAI()})}
else if(tab==='politics'){let h='<div class="panel-title">'+t('pol_title')+'</div>';h+='<div style="margin-bottom:10px;font-size:13px;color:#789;">'+t('pp_available')+'<b style="color:#ff44ff">'+Math.floor(state.politicalPoints)+'</b> / '+state.ppMax+'</div><div class="pol-grid">';Object.keys(REGIMES).forEach(id=>{if(id==='anarchy')return;let r=REGIMES[id],isCur=state.regime===id,cc=!isCur&&state.politicalPoints>=r.ppCost,cls=isCur?'current':cc?'':'unaffordable';h+='<div class="pol-card '+cls+'" data-regime="'+id+'" data-active-label="'+t('active')+'"><div class="pol-name">'+r.name[currentLang]+'</div><div style="font-size:11px;color:#888;margin-bottom:5px;">'+r.subtitle[currentLang]+'</div><div class="pol-pros">'+r.pros[currentLang].replace(/\n/g,'<br>')+'</div><div class="pol-cons">'+r.cons[currentLang].replace(/\n/g,'<br>')+'</div>'+(isCur?'':'<div class="pp-cost">'+t('regime_cost')+r.ppCost+t('po')+'</div>')+'</div>'});h+='</div>';if(state.debuffEnd>Date.now()&&state.debuffType==='anarchy'){h+='<div class="pol-card anarchy" style="margin-top:10px;"><div class="pol-name" style="color:#ff4444;">'+REGIMES.anarchy.name[currentLang]+'</div><div style="font-size:11px;color:#888;margin-bottom:5px;">'+REGIMES.anarchy.subtitle[currentLang]+'</div><div class="pol-pros">'+REGIMES.anarchy.pros[currentLang].replace(/\n/g,'<br>')+'</div><div class="pol-cons">'+REGIMES.anarchy.cons[currentLang].replace(/\n/g,'<br>')+'</div></div>'}h+='<div style="margin-top:12px;font-size:13px;color:#789;line-height:1.4;">'+t('reg_change_warning')+'</div>';c.innerHTML=h;c.querySelectorAll('.pol-card[data-regime]').forEach(card=>{card.addEventListener('click',()=>{let id=card.dataset.regime;if(id===state.regime)return;let r=REGIMES[id];if(state.politicalPoints<r.ppCost){addLog(t('not_enough_pp'),'bad');sfxError();return}state.politicalPoints-=r.ppCost;state.regime=id;state.debuffEnd=Date.now()+3e5;state.debuffType='anarchy';addLog(t('regime_change')+r.name[currentLang]+t('instability5'),'warn');sfxRegime();renderPanel('politics')})})}
else if(tab==='map'){let h='<div class="panel-title">'+t('map_title')+'</div><div style="font-size:13px;color:#789;line-height:1.6;">';h+='<div style="margin-bottom:8px;">'+t('buildings_count')+'<b style="color:#00e5ff">'+state.buildings.filter(b=>b.built).length+'</b></div>';h+='<div style="margin-bottom:8px;">'+t('units_count')+'<b style="color:#ff8844">'+state.units.length+'</b></div>';h+='<div style="margin-bottom:8px;">'+t('play_time')+'<b style="color:#00e5ff">'+Math.floor(state.gameTime/60)+t('min')+'</b></div>';h+='<div style="margin-bottom:8px;">'+t('current_regime')+'<b style="color:#ff44ff">'+REGIMES[state.regime].name[currentLang]+'</b></div>';h+='<div style="margin-bottom:12px;">'+t('total_players')+'</div></div>';let nr=getNearestAI().slice(0,8);h+='<div style="font-size:13px;color:#ff6644;font-weight:600;margin-bottom:6px;">'+t('nearest_ai')+'</div><div class="ai-list">';if(nr.length===0)h+='<div class="ai-row">'+t('no_ai_near')+'</div>';else nr.forEach(n=>{let dd=(n.dist*180/Math.PI).toFixed(1);h+='<div class="ai-row'+(n.dist<territories[0].radius*1.5?' near':'')+'"><span class="ai-row-name">AI-'+n.ai.id+' ('+REGIMES[n.ai.regime].name[currentLang]+')</span><span class="ai-row-stats">'+n.ai.buildings+(currentLang==='en'?'b':'з')+' / '+n.ai.units+(currentLang==='en'?'u':'в')+' / '+dd+'°</span></div>'});h+='</div>';h+='<div style="margin-top:12px;"><button id="btn-save" style="padding:10px 16px;background:rgba(0,229,255,.1);border:1px solid rgba(0,229,255,.25);color:#00e5ff;border-radius:5px;cursor:pointer;font-family:inherit;font-size:14px;margin-right:8px;">'+t('save')+'</button><button id="btn-new-game" style="padding:10px 16px;background:rgba(255,60,60,.1);border:1px solid rgba(255,80,80,.25);color:#ff6666;border-radius:5px;cursor:pointer;font-family:inherit;font-size:14px;">'+t('reset_btn')+'</button></div>';c.innerHTML=h;document.getElementById('btn-save')?.addEventListener('click',()=>{sfxClick();saveGame();addLog(t('saved'),'good')});document.getElementById('btn-new-game')?.addEventListener('click',()=>{if(confirm(t('reset_confirm'))){resetGame();renderPanel('map')}})}
else if(tab==='info'){let h='<div class="panel-title">'+t('info_title')+'</div><div style="font-size:14px;color:#c8e6ff;line-height:1.6;">';h+='<p style="margin-bottom:10px;">'+t('info_year')+'</p>';h+='<p style="margin-bottom:10px;">'+t('info_territories')+': '+t('info_territory_desc')+'</p>';h+='<p style="margin-bottom:10px;">'+t('info_buildings')+':<br>';Object.keys(BUILDINGS).forEach(id=>{let b=BUILDINGS[id];h+='• '+b.icon+' '+t(b.nameKey)+' ('+(b.category==='center'?t('zone_center'):t('zone_outer'))+') — '+t(b.descKey)+' ('+(b.cost.regolith||0)+' '+t('regolith_short')+', '+(b.cost.helium||0)+' '+t('helium_short')+', '+(b.cost.energy||0)+' '+t('energy_short')+')<br>'});h+='</p><p style="margin-bottom:10px;">'+t('info_regimes')+':<br>';Object.keys(REGIMES).forEach(id=>{if(id==='anarchy')return;let r=REGIMES[id];h+='• '+r.name[currentLang]+' ('+r.subtitle[currentLang]+') — '+t('regime_pros')+': '+r.pros[currentLang].replace(/\n/g,'; ')+'; '+t('regime_cons')+': '+r.cons[currentLang].replace(/\n/g,'; ')+' ('+r.ppCost+' '+t('po')+')<br>'});let an=REGIMES.anarchy;h+='• '+an.name[currentLang]+' ('+an.subtitle[currentLang]+') — '+t('regime_pros')+': '+an.pros[currentLang].replace(/\n/g,'; ')+'; '+t('regime_cons')+': '+an.cons[currentLang].replace(/\n/g,'; ')+'<br>';h+='</p><p style="margin-bottom:10px;">'+t('info_units_h')+':<br>';Object.keys(UNITS).forEach(id=>{let u=UNITS[id];h+='• '+u.icon+' '+t(u.nameKey)+' — '+t(u.descKey)+'<br>'});h+='</p><p style="font-size:12px;margin-top:12px;">'+t('info_offline')+'</p></div>';c.innerHTML=h}
else if(tab==='settings'){let h='<div class="panel-title">'+t('settings_title')+'</div>';h+='<div class="set-row"><div><div class="set-label">'+t('language')+'</div></div><div class="set-control"><button class="set-lang-btn '+(currentLang==='ru'?'active':'')+'" data-lang="ru">RU</button><button class="set-lang-btn '+(currentLang==='en'?'active':'')+'" data-lang="en">EN</button></div></div>';h+='<div class="set-row"><div><div class="set-label">'+t('master_vol')+'</div><div class="set-desc">'+t('master_desc')+'</div></div><div class="set-control"><input type="range" class="set-slider" id="slider-master" min="0" max="100" value="'+(settings.master*100)+'"></div></div>';h+='<div class="set-row"><div><div class="set-label">'+t('music')+'</div><div class="set-desc">'+t('music_desc')+'</div></div><div class="set-control"><div class="set-toggle '+(settings.music?'on':'')+'" id="toggle-music"></div></div></div>';h+='<div class="set-row"><div><div class="set-label">'+t('sfx')+'</div><div class="set-desc">'+t('sfx_desc')+'</div></div><div class="set-control"><div class="set-toggle '+(settings.sfx?'on':'')+'" id="toggle-sfx"></div></div></div>';h+='<div class="set-row"><div><div class="set-label">'+t('mute_all')+'</div><div class="set-desc">'+t('mute_desc')+'</div></div><div class="set-control"><div class="set-toggle '+(settings.muted?'on':'')+'" id="toggle-mute"></div></div></div>';c.innerHTML=h;c.querySelectorAll('.set-lang-btn').forEach(btn=>{btn.addEventListener('click',()=>{currentLang=btn.dataset.lang;localStorage.setItem('luna_lang',currentLang);applyI18n();sfxClick();renderPanel('settings');updateUI();rebuildMarkers()})});document.getElementById('slider-master').addEventListener('input',e=>{settings.master=parseInt(e.target.value)/100;applyAudioSettings();saveSettings()});document.getElementById('toggle-music').addEventListener('click',()=>{settings.music=!settings.music;applyAudioSettings();saveSettings();if(settings.music&&!settings.muted&&audioCtx)startMusic();else if(!settings.music)stopMusic();renderPanel('settings')});document.getElementById('toggle-sfx').addEventListener('click',()=>{settings.sfx=!settings.sfx;applyAudioSettings();saveSettings();renderPanel('settings');sfxClick()});document.getElementById('toggle-mute').addEventListener('click',()=>{settings.muted=!settings.muted;applyAudioSettings();saveSettings();if(settings.muted)stopMusic();else if(settings.music&&audioCtx)startMusic();renderPanel('settings')})}}
function attackNearestAI(){if(state.units.length<3){addLog(t('not_enough_units'),'bad');sfxError();return}let nr=getNearestAI()[0];if(!nr){addLog(t('no_ai_near'),'bad');return}let ai=nr.ai,am=getMod('attackMod'),myPow=state.units.reduce((s,u)=>s+u.attack*am,0),aiDef=ai.units*8+ai.buildings*5;sfxCombat();if(myPow>aiDef*.8){let lost=Math.floor(state.units.length*.3);state.units.splice(0,lost);let lm=getMod('lootMod'),gain=Math.floor((ai.regolith*.3+ai.helium*.2)*lm);state.regolith+=gain;ai.buildings=Math.max(0,ai.buildings-1);ai.units=Math.max(0,ai.units-3);addLog(t('victory')+gain+'. '+(currentLang==='en'?'Units lost: ':'Потеряно: ')+lost,'good');rebuildMarkers()}else{let lost=Math.floor(state.units.length*.6);state.units.splice(0,lost);addLog(t('defeat')+lost,'bad')}updateUI()}
let lastTime=performance.now(),clock=new THREE.Clock();const earthRotSpeed=476e-6,moonRotSpeed=earthRotSpeed*.95;
function animate(){requestAnimationFrame(animate);let now=performance.now(),dt=Math.min(.1,(now-lastTime)/1e3);lastTime=now;let t2=clock.getElapsedTime();gameTick(dt);earthAtmoMat.uniforms.uTime.value=t2;markers.forEach((m,i)=>{let p=1+Math.sin(t2*3+i*.7)*.2;if(m.userData.glow){m.userData.glow.scale.setScalar(p);m.userData.glow.material.opacity=.15+Math.sin(t2*3+i*.7)*.1}});let cd=camera.position.clone().normalize();bgSphere.rotation.y=-cd.x*.04;bgSphere.rotation.x=cd.y*.03;bgSphere.rotation.z=cd.x*.015;if(Date.now()-lastInteract>3e4)controls.autoRotate=true;if(controls.autoRotate){moonGroup.rotation.y+=moonRotSpeed*rotFactor;earthGroup.rotation.y+=earthRotSpeed*rotFactor}updateLOD();controls.update();renderer.render(scene,camera);if(Math.floor(t2*2)!==Math.floor((t2-dt)*2))updateUI()}
addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight);renderer.setPixelRatio(Math.min(devicePixelRatio,isMobile?1.5:2))});addEventListener('beforeunload',saveGame);
applyI18n();rebuildMarkers();updateUI();animate();addLog(t('game_started'),'good');
</script>
